repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
        args: [--fix]
        fail_fast: true
      - id: ruff-format
        fail_fast: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -x -n auto --dist worksteal --timeout=30
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: module-imports
        name: module-imports
        entry: uv run python scripts/check_module_imports.py
        language: system
        types: [python]
        pass_filenames: true
      - id: signal-routing
        name: signal-routing
        entry: uv run python scripts/check_signal_routing.py
        language: system
        types: [python]
        pass_filenames: true
      - id: check-graph-payload-architecture
        name: check graph payload architecture
        entry: uv run python scripts/check_graph_payload_architecture.py
        language: system
        pass_filenames: false
        files: ^(src/orchestrator/(graph|graph_runtime|api|db|workflow)/|scripts/(check_graph_payload_architecture|measure_graph_payload_architecture|w5_payload_ast_inventory)\.py|scripts/codemods/w5_task12_event_payload_reads\.py|tests/unit/(test_w5_payload_ast_inventory|test_w5_strict_payload_codemod|test_graph_change_spread|test_graph_catalog_contracts)\.py)
      - id: enum-drift
        name: enum-drift
        entry: uv run python scripts/export_enums.py --check
        language: system
        pass_filenames: false
        files: ^(src/orchestrator/config/enums\.py|ui/src/types/generated-enums\.ts)$
      - id: ui-lint
        name: ui-lint
        entry: bash -c 'test -d ui/node_modules && npm --prefix ui run lint || echo "Skipping ui-lint (node_modules not installed)"'
        language: system
        pass_filenames: false
      - id: ui-typecheck
        name: ui-typecheck
        entry: bash -c 'test -d ui/node_modules && npm --prefix ui run typecheck || echo "Skipping ui-typecheck (node_modules not installed)"'
        language: system
        pass_filenames: false
