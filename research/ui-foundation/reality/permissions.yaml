completion_phase: 1
key_namespace: canonical
items:
- id: PER-1
  title: Optional global bearer authentication
  definition: When enabled, API and MCP middleware require a valid bearer JWT; authentication is disabled
    by default.
  implementation_status: present
  test_status: unexercised
  documentation_status: documented
  capability_status: unknown
  epistemic_status: observed
  confidence: high
  confidence_basis: 04-api-actions-authority.md#api-authn-jwt and integration auth tests
  evidence_ids:
  - EVD-38
  conflict_ids:
  - CON-4
  question_ids:
  - Q-5
  limitations:
  - Claims are not bound to a routed action actor
  - Capability classification is blocked by an unresolved canonical conflict or question.
  prohibited_interpretations:
  - A valid token proves product-role authorization
  enforced_authentication: Optional global valid-bearer gate
  enforced_authorization: absent
  domain_eligibility: Not an action eligibility rule.
  proposed_product_role_policy: null
- id: PER-2
  title: Routed endpoint authorization boundary
  definition: Routed mutations have no verified per-action subject, role, scope, ownership, membership,
    or permission check.
  implementation_status: absent
  test_status: unexercised
  documentation_status: documented
  capability_status: gap
  epistemic_status: observed
  confidence: high
  confidence_basis: 04-api-actions-authority.md#api-authz-roles
  evidence_ids:
  - EVD-39
  conflict_ids:
  - CON-4
  question_ids:
  - Q-5
  limitations:
  - Optional authentication can still gate transport
  prohibited_interpretations:
  - Caller strings or audit attribution are authorization
  enforced_authentication: Optional global valid-bearer gate
  enforced_authorization: absent
  domain_eligibility: Endpoint-specific schema, target, and state checks remain separate.
  proposed_product_role_policy: Unspecified; no role policy is admitted by this synthesis.
- id: PER-3
  title: Legacy workflow domain eligibility
  definition: Legacy run, task, step, clarification, recovery, fan-out, transition-back, and run-recover
    routes apply workflow state, gate, request, and target prerequisites.
  implementation_status: present
  test_status: unexercised
  documentation_status: documented
  capability_status: unknown
  epistemic_status: observed
  confidence: high
  confidence_basis: 03-workflow-state.md and 04-api-actions-authority.md legacy action tables
  evidence_ids:
  - EVD-40
  conflict_ids:
  - CON-4
  question_ids:
  - Q-5
  limitations:
  - Fixed or caller-supplied actor values are attribution only
  - Capability classification is blocked by an unresolved canonical conflict or question.
  prohibited_interpretations:
  - Domain transition eligibility is human-role authorization
  - Review or administration eligibility
  enforced_authentication: Optional global valid-bearer gate
  enforced_authorization: absent
  domain_eligibility: Legacy run/task state, gate, request, target, validation, and operation-specific
    prerequisites only.
  proposed_product_role_policy: null
