id: ACT-51
implementation_status: present
capability_status: unknown
executable: true
command_id: CMD-6
actor: REST caller; graph lifecycle application is a mode-specific CMD-6 consequence, not product-role
  authorization.
permission_requirements:
- PER-1
- PER-2
- PER-3
- PER-4
preconditions:
- ACT-21 accepted REST cancellation from a paused legacy row.
- The addressed graph run is paused and graph mode cancellation applies.
expected_source_version: The REST cancel request supplies no client row or graph position; REST acceptance
  preserves the paused legacy row while this graph-run carrier transitions separately.
required_input:
  run_id: required
validation:
- CMD-6 validates paused legacy-row cancellation and enqueues its signal
- PER-4 validates graph lifecycle cancellation from paused
durable_effect: Graph cancellation transitions the graph-run carrier from paused to cancelling; terminal
  graph cancellation is the paired ACT-48 consequence.
resulting_state_id: STA-22
failure_modes:
- 404 missing run/graph
- 409 stopping or illegal cancellation state
- executor cancellation failure
stale_state_behavior: A duplicate or delayed cancellation observes the graph lifecycle state; it does
  not transition the graph run into a legacy row carrier.
idempotency: No idempotency key; graph lifecycle state determines whether a repeat is eligible.
retry_behavior: Read REST activity and graph-run state; do not treat 202 acceptance as proof that graph
  cancellation is terminal.
reversibility: No direct uncancel; later recovery is separate and is not reversal.
audit_evidence_ids:
- EVD-11
- EVD-20
- EVD-38
- EVD-39
- EVD-40
transition:
  from_state_id: STA-20
  to_state_id: STA-22
carrier_relationship:
  kind: paired graph-run entry consequence
  paired_graph_run_terminal_action_id: ACT-48
  paired_node_consequence_action_id: ACT-49
  rest_acceptance_action_id: ACT-21
  rest_acceptance_transition:
    from_state_id: STA-4
    to_state_id: STA-4
  rest_eventual_application_transition:
    from_state_id: STA-4
    to_state_id: STA-7
  ordering: CMD-6 acceptance preserves the paused legacy row; this graph run enters cancelling, then ACT-48
    reaches graph-cancelled, while ACT-49 handles eligible node cancellation on its own carrier.
enforced_authentication: PER-1 optional global valid-bearer gate.
enforced_authorization: absent
domain_eligibility: PER-3 paused legacy-row cancel eligibility and PER-4 graph paused-to-cancelling eligibility.
