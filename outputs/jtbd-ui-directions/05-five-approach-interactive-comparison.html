    }
    function render() {
      const cartography = `<section class="slide" data-slide="cartography"><header><h1>Operational Cartography</h1>${state.slide === 'cartography' ? stateRail() : ''}</header>${renderCartography(SCENARIO, state.workspaceState, state.selectedByConcept.cartography)}</section>`;
      const causal = `<section class="slide" data-slide="causal"><header><h1>Causal Spine</h1>${state.slide === 'causal' ? stateRail() : ''}</header>${renderCausalSpine(SCENARIO, state.workspaceState, state.selectedByConcept.causal)}</section>`;
      const intervention = `<section class="slide" data-slide="intervention"><header><h1>Intervention Desk</h1>${state.slide === 'intervention' ? stateRail() : ''}</header>${renderInterventionDesk(SCENARIO, state.workspaceState, state.selectedByConcept.intervention)}</section>`;
      const evidence = state.slide === 'evidence' ? `<section class="slide" data-slide="evidence"><header><h1>Evidence Workbench</h1>${stateRail()}</header>${renderEvidenceWorkbench(SCENARIO, state.workspaceState, state.selectedByConcept.evidence)}</section>` : renderPlaceholderConcept('evidence', 'Evidence Workbench');
      const weave = state.slide === 'weave' ? `<section class="slide" data-slide="weave"><header><h1>Mission Weave</h1>${stateRail()}</header>${renderMissionWeave(SCENARIO, state.workspaceState, state.selectedByConcept.weave)}</section>` : renderPlaceholderConcept('weave', 'Mission Weave');
      const markup = [renderLoop(), cartography, causal, intervention, evidence, weave, renderComparison()].join('');
      document.querySelector('#slides').innerHTML = markup;
      document.querySelector('#modal-root').innerHTML = renderDecisionModal();
      document.querySelectorAll('[data-slide]').forEach((slide) => { slide.hidden = slide.dataset.slide !== state.slide; });
      const slideTitles = { loop: 'One operating loop, five interface models', cartography: 'Operational Cartography', causal: 'Causal Spine', intervention: 'Intervention Desk', evidence: 'Evidence Workbench', weave: 'Mission Weave', comparison: 'Compare architectural trade-offs' };
      const slidePosition = document.querySelector('#slide-position');
      slidePosition.textContent = `${SLIDES.indexOf(state.slide) + 1} / ${SLIDES.length}`;
      slidePosition.setAttribute('aria-current', 'page');
      slidePosition.setAttribute('aria-label', `Slide ${SLIDES.indexOf(state.slide) + 1} of ${SLIDES.length}: ${slideTitles[state.slide]}`);
      document.querySelectorAll('[data-workspace-state]').forEach((button) => button.addEventListener('click', () => setWorkspaceState(button.dataset.workspaceState, true)));
    }
    document.querySelector('[data-action="previous-slide"]').addEventListener('click', () => goToSlide(SLIDES[Math.max(0, SLIDES.indexOf(state.slide) - 1)]));
    document.querySelector('[data-action="next-slide"]').addEventListener('click', () => goToSlide(SLIDES[Math.min(SLIDES.length - 1, SLIDES.indexOf(state.slide) + 1)]));
    document.addEventListener('click', (event) => {
      if (state.modal && (!(event.target instanceof Element) || !event.target.closest('[data-modal-backdrop]'))) return;
      const actionTarget = event.target instanceof Element ? event.target.closest('[data-action]') : null;
      if (actionTarget instanceof HTMLElement) {
        if (actionTarget.dataset.action === 'review-intervention') openDecisionModal('intervention', '[data-action="review-intervention"]');
        if (actionTarget.dataset.action === 'cancel-decision') closeDecisionModal();
        if (actionTarget.dataset.action === 'confirm-decision') {
          state.modal = null;
          state.workspaceState = 'outcome';
          state.decisionResult = 'Accepted locally · outcome workspace selected · no backend command sent.';
          document.body.classList.remove('modal-open');
          document.querySelector('[data-presentation]')?.removeAttribute('inert');
          render();
          document.querySelector('[data-decision-result]')?.focus();
          announce('Accepted proposed correction locally; outcome workspace selected.');
        }
        if (actionTarget.dataset.action === 'await-release-approval') announce('Release manager approval remains required.');
        return;
      }
      if (event.target instanceof Element && event.target.matches('[data-modal-backdrop]')) { closeDecisionModal(); return; }
      const evidenceLayerTarget = event.target instanceof Element ? event.target.closest('[data-evidence-layer], [data-evidence-layer-close]') : null;
      if (evidenceLayerTarget instanceof HTMLElement) {
        const recordId = evidenceLayerTarget.dataset.evidenceLayerClose || evidenceLayerTarget.dataset.evidenceLayer || null;
        state.evidenceLayer = evidenceLayerTarget.hasAttribute('data-evidence-layer-close') ? null : recordId;
        render();
        if (state.evidenceLayer) document.querySelector(`#evidence-layer-${state.evidenceLayer}`)?.focus();
        else if (recordId) document.querySelector(`[data-evidence-layer="${recordId}"]`)?.focus();
        announce(state.evidenceLayer ? `Opened ${state.evidenceLayer} evidence detail` : 'Closed evidence detail');
        return;
      }
      const target = event.target instanceof Element ? event.target.closest('[data-concept="cartography"] [data-node-id], [data-concept="causal"] [data-event-id], [data-concept="intervention"] [data-case-id], [data-concept="evidence"] [data-claim-id], [data-concept="evidence"] [data-node-id], [data-concept="weave"] [data-weave-segment], [data-source-node-id], [data-source-requirement], [data-source-run]') : null;
      if (!(target instanceof HTMLElement)) return;
      if (target.dataset.sourceNodeId) { selectObject('cartography', target.dataset.sourceNodeId); goToSlide('cartography'); return; }
      if (target.hasAttribute('data-source-requirement')) { goToSlide('cartography'); document.querySelector(`[data-requirement-id="${authoritativeRequirement(SCENARIO).id}"]`)?.focus(); return; }
      if (target.hasAttribute('data-source-run')) { document.querySelector('[data-causal-run-record]')?.focus(); return; }
      if (target.dataset.nodeId) { selectObject('cartography', target.dataset.nodeId); if (target.closest('[data-concept="evidence"]')) goToSlide('cartography'); }
      if (target.dataset.eventId) selectObject('causal', target.dataset.eventId);
      if (target.dataset.caseId) selectObject('intervention', target.dataset.caseId);
      if (target.dataset.claimId) selectObject('evidence', target.dataset.claimId);
      if (target.dataset.weaveSegment) selectObject('weave', target.dataset.weaveSegment);
    });
    addEventListener('hashchange', () => {
      const id = SLIDES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'loop';
      if (state.slide === id) return;
      state.slide = id;
      render();
      announce(`Slide: ${id}`);
    });
    addEventListener('keydown', (event) => {
      const editableTarget = event.target instanceof Element && event.target.closest('input, textarea, select, [contenteditable]:not([contenteditable="false"])');
      if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || (event.shiftKey && state.modal === null) || editableTarget) return;
      if (state.modal !== null) {
        if (event.key === 'Escape') { event.preventDefault(); closeDecisionModal(); return; }
        if (event.key === 'Tab') {
          const buttons = [...document.querySelectorAll('[role="dialog"] button:not([disabled])')];
          const first = buttons[0];
          const last = buttons.at(-1);
          if (first && last && (event.shiftKey ? document.activeElement === first : document.activeElement === last)) { event.preventDefault(); (event.shiftKey ? last : first).focus(); }
        }
        return;
      }
      if (event.key === 'Escape' && state.evidenceLayer) { const recordId = state.evidenceLayer; state.evidenceLayer = null; render(); document.querySelector(`[data-evidence-layer="${recordId}"]`)?.focus(); announce('Closed evidence detail'); return; }
      if (event.key === 'ArrowLeft') goToSlide(SLIDES[Math.max(0, SLIDES.indexOf(state.slide) - 1)]);
      if (event.key === 'ArrowRight') goToSlide(SLIDES[Math.min(SLIDES.length - 1, SLIDES.indexOf(state.slide) + 1)]);
      if (/^[1-5]$/.test(event.key)) setWorkspaceState(WORKSPACE_STATES[Number(event.key) - 1]);
    });
    state.slide = SLIDES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'loop';
    globalThis.openDecisionModal = openDecisionModal;
    globalThis.closeDecisionModal = closeDecisionModal;
    window.taskWorldPresentation = Object.freeze({ getState: () => structuredClone(state), goToSlide, setWorkspaceState, selectObject });
    try { render(); } catch (error) { document.body.innerHTML = `<main role="alert"><h1>Presentation could not start</h1><pre>${escapeHtml(error instanceof Error ? error.message : error)}</pre></main>`; }
  </script>
</body>
</html>
