- kind: artifact-reference
  identity: CAS artifact identity is content SHA-256 plus size/media metadata; declared graph artifact references have record
    identity/type/path URI; legacy interaction logs have execution-tuple row identity.
  producer: Check-output externalization to CAS; worker artifact declarations; legacy PhaseHandler/AttemptStore interaction-log
    upsert.
  persistence: CAS blobs are content-addressed and verified; declaration records persist without reading the target file;
    interaction rows are mutable direct DB upserts.
  attribution: CAS download authorization follows a run check-result reference; declarations carry run/node/candidate context;
    interaction logs carry run/task/attempt/runner/phase.
  query_surface: Run artifact range endpoint for authorized CAS references; graph record/node details for declarations; no
    dedicated interaction-log retrieval API.
  freshness: CAS integrity is checked on read; a path declaration has no existence/content freshness guarantee; interaction
    rows are mutable.
  consistency: CAS publication/GC are coordinated, but generic declarations and legacy interaction logs do not share the CAS
    integrity contract.
  missing_behavior: Generic artifact references are not verified/downloadable CAS blobs; no shared artifact ID or unified
    inventory exists.
  current_availability: The approved bounded audit reports CAS check artifacts as implemented with inspected-test coverage;
    implementation/test source freshness is not hash-guarded and no fresh test result is asserted. Declared references and
    interaction logs have distinct, weaker partial coverage and no unified artifact contract.
  epistemic_limits: The word artifact denotes several carriers with different identity, authority, and retention boundaries.
