required_input: {run_id: required}
validation: ["legacy lifecycle state validation", "executor cancellation and signal enqueue"]
durable_effect: "Cancels registered execution and appends cancellation signal acceptance evidence while the row remains active; the consumer later applies active to cancelled. Graph mode separately performs graph-local cancellation before row cancellation."
