      const stateNotes = selected.stateSummaries;
      const packet = `<section class="concept-workspace intervention-desk" data-concept="intervention" data-state="${workspaceState}">
        <aside class="intervention-queue ${emphasis('fleet')}" data-intervention-focus="fleet"><small class="case-queue-label">Unresolved operator cases · ranked</small><h2>Exception queue</h2><div class="intervention-fleet"><div class="intervention-fleet-ribbon" role="img" aria-label="${scenario.fleet.attention} need attention, ${scenario.fleet.progressing} progressing, ${scenario.fleet.waiting} waiting"><i style="--share:${scenario.fleet.attention}">${scenario.fleet.attention}</i><i style="--share:${scenario.fleet.progressing}">${scenario.fleet.progressing}</i><i style="--share:${scenario.fleet.waiting}">${scenario.fleet.waiting}</i></div><small>${scenario.fleet.progressing} healthy runs progressing · compressed</small></div><p class="intervention-state-note">${stateNotes[workspaceState]}</p><ol class="case-queue">${cases.map((caseRecord) => `<li><button type="button" class="${caseRecord.id === selected.id ? 'is-selected ' : ''}${caseRecord.id === selected.id ? emphasis('position') : ''}" data-case-id="${caseRecord.id}" ${caseRecord.id === selected.id ? 'data-intervention-focus="position"' : ''}><small class="case-urgency">Rank ${caseRecord.rank} · ${escapeHtml(caseRecord.blockedScope)}</small><strong>${escapeHtml(caseRecord.title)}</strong><span>Age · ${caseRecord.ageMinutes} min · process age · ${escapeHtml(caseRecord.processAge)} · ${caseRecord.reversible ? 'reversible' : 'human gate'}</span><span>${escapeHtml(caseRecord.confidence)}</span><small>${escapeHtml(caseRecord.runName)} · ${caseRecord.runId}</small></button></li>`).join('')}</ol></aside>
        <article class="decision-packet" aria-label="Selected decision packet"><header><div><small>Selected operator case</small><h2>${escapeHtml(selected.title)}</h2></div><small>${escapeHtml(selected.runName)} · ${selected.runId}</small></header><div class="packet-focus-group ${emphasis('cause')}" data-intervention-focus="cause"><section class="packet-step" data-packet-step="trigger"><small>Trigger / constraint</small><p><b>${escapeHtml(selected.trigger)}</b>${selected.requirementId ? ` · ${selected.requirementId} required` : ''}.</p></section><section class="packet-step" data-packet-step="evidence"><small>Evidence</small><p>${escapeHtml(selected.evidence)}</p></section></div><div class="packet-focus-group ${emphasis('outcome')}" data-intervention-focus="outcome"><section class="packet-step" data-packet-step="consequence"><small>Consequence</small><p><b>${escapeHtml(selected.consequence)}</b>${selected.attemptsLeft ? ` · ${selected.attemptsLeft} attempt${selected.attemptsLeft === 1 ? '' : 's'} remains` : ''}.</p></section></div><div class="packet-focus-group ${emphasis('action')}" data-intervention-focus="action"><section class="packet-step" data-packet-step="options"><small>Options</small><p class="packet-option">${escapeHtml(selected.options)}</p>${selected.proposed ? `<p class="packet-option packet-proposed">${escapeHtml(selected.proposed)}</p>` : ''}</section><section class="packet-step" data-packet-step="authority"><small>Authority</small><p>${escapeHtml(selected.authority)} · ${selected.reversible ? 'reversible correction' : 'human approval boundary'}.</p></section><div class="packet-focus-group ${emphasis('outcome')}" data-intervention-focus="outcome"><section class="packet-step" data-packet-step="validation"><small>Validation</small><p>${escapeHtml(selected.validation)}</p></section></div><section class="packet-step packet-action" data-packet-step="action"><small>Action</small><div><p>Submit the proposed intervention for operator review.</p><button type="button" data-action="review-intervention">Review proposed intervention</button></div></section></div></article>
      </section>`;
      return packet.replace('Submit the proposed intervention for operator review.', selected.actionDescription).replace('<button type="button" data-action="review-intervention">Review proposed intervention</button>', selected.actionMarkup);
    }
    function renderEvidenceWorkbench(scenario, workspaceState, selectedId) {
      const selectedRequirement = scenario.requirements.find((requirement) => requirement.id === selectedId) || null;
      const displayedRequirement = selectedRequirement || scenario.requirements[0];
      const selectionNote = selectedRequirement ? '' : `<p class="evidence-selection-note">Selection ${escapeHtml(selectedId)} is unavailable; showing canonical requirement ${displayedRequirement.id}.</p>`;
      const gradeHistory = describeEvidenceGradeHistory(displayedRequirement.grades);
      const successors = scenario.run.successors;
      const successorYs = getLocatorSuccessorYs(successors.length);
      const stateNotes = {
        fleet: `${scenario.fleet.attention} active runs need attention; this requirement is the evidence-bearing exception.`,
        position: `Requirement ${displayedRequirement.id} sits at the recovery boundary and holds ${successors.length} successors.`,
        cause: `${gradeHistory.repeated ? `${gradeHistory.summary} have the same omission` : `${gradeHistory.summary} is mixed`}: ${scenario.evidence.missing.join(' and ')}.`,
        action: 'Open the source records, bind the omitted evidence, then return the packet to verification.',
        outcome: `The matrix preserves lineage, cost, and evidence deltas needed to establish grade ${scenario.outcome.finalGrade}.`,
      };
      const activeRecord = scenario.evidence.records.find((record) => record.id === state.evidenceLayer) || null;
      return `<section class="concept-workspace evidence-workbench" data-concept="evidence" data-state="${workspaceState}">
        <nav class="claim-index" aria-label="Requirement claims"><small>Requirement index</small><h2>Claims</h2>${scenario.requirements.map((requirement) => `<button type="button" class="${selectedRequirement?.id === requirement.id ? 'is-selected' : ''}" data-claim-id="${requirement.id}" aria-pressed="${selectedRequirement?.id === requirement.id}"><b>${escapeHtml(requirement.name)}</b><small>${requirement.id} · ${requirement.required ? 'required' : 'optional'} · ${requirement.grades.join(' → ')}</small></button>`).join('')}</nav>
        <main class="evidence-matrix"><h2>${escapeHtml(displayedRequirement.name)}</h2><small>${displayedRequirement.id} · node lineage</small>${selectionNote}<p class="evidence-state-note">${stateNotes[workspaceState]}</p>${renderNodeRows(scenario.nodes)}<section class="packet-delta" aria-label="Packet and file evidence deltas"><b>Missing in both attempts</b><span>${scenario.evidence.missing.map(escapeHtml).join(' · ')}</span><b>Changed implementation</b><span>${scenario.evidence.changedFiles} files · +${scenario.evidence.additions}/−${scenario.evidence.deletions}</span><b>Provenance</b><span>${scenario.run.id} · requirement ${displayedRequirement.id} · grades ${gradeHistory.history}</span></section><section class="evidence-records" aria-label="Raw evidence sources">${scenario.evidence.records.map((record) => `<article class="evidence-record" data-evidence-record="${record.id}"><div><strong>${escapeHtml(record.label)}</strong><small>${record.nodeId} · ${record.kind} · attempt ${record.attempt} · ${escapeHtml(record.source)} · ${escapeHtml(record.size)}</small></div><button type="button" data-evidence-layer="${record.id}" aria-expanded="${activeRecord?.id === record.id}" aria-controls="evidence-layer-${record.id}">Open ${escapeHtml(record.label)}</button></article>`).join('')}</section>${activeRecord ? `<section class="evidence-layer" id="evidence-layer-${activeRecord.id}" tabindex="-1" aria-live="polite"><small>${escapeHtml(activeRecord.label)} · ${escapeHtml(activeRecord.source)} · ${escapeHtml(activeRecord.size)}</small><pre>${escapeHtml(activeRecord.body)}</pre><button type="button" data-evidence-layer-close="${activeRecord.id}">Close ${escapeHtml(activeRecord.label)}</button></section>` : ''}</main>
        <aside class="graph-locator" aria-label="Selected requirement with ${successors.length} blocked successors"><strong>Constraint locator</strong><small>${scenario.run.id} · blast radius ${successors.length} successors</small><svg viewBox="0 0 220 150" aria-hidden="true"><path d="M20 75 L95 75 ${successors.map((successor, index) => `M95 75 L175 ${successorYs[index]}`).join(' ')}"/>${successors.map((successor, index) => `<circle data-locator-successor="${successor.id}" cx="${175}" cy="${successorYs[index]}" r="6"><title>${escapeHtml(successor.name)}</title></circle>`).join('')}<circle cx="95" cy="75" r="10"/></svg></aside>
      </section>`;
    }
    const visibleWeaveSegments = (workspaceState) => WEAVE_SEGMENTS.filter((segment) => workspaceState === 'outcome' || (workspaceState === 'action' ? segment.id !== 'verify-correction' && segment.id !== 'final-gate' && segment.id !== 'merge' : segment.row < 3));
    function renderMissionWeave(scenario, workspaceState, selectedId) {
      const visible = visibleWeaveSegments(workspaceState);
      const selected = visible.find((segment) => segment.id === selectedId) || visible[visible.length - 1];
      const notes = {
        fleet: `${scenario.fleet.attention} of ${scenario.fleet.active} active runs need attention; miniature weaves compress healthy work.`,
        position: 'Five stable lanes retain their role while workstream rows grow downward.',
        cause: `Two verifier C grades loop recovery work back to Build; ${scenario.run.successors.length} canonical successors remain held.`,
        action: `Proposed capability binds ${scenario.evidence.missing.join(' and ')} before another verifier pass.`,
        outcome: `Grade ${scenario.outcome.finalGrade} establishes the invariant; ${scenario.run.successors.length} successors can converge through merge.`,
      };
      const segmentCard = (segment) => {
        const resolvedCorrection = segment.status === 'proposed' && workspaceState === 'outcome';
        const displayedStatus = resolvedCorrection ? 'verified' : segment.status;
        const label = resolvedCorrection ? 'Replay + incident evidence bound' : segment.label;
        const grade = segment.status === 'blocking' ? 'C' : segment.id === 'verify-correction' ? scenario.outcome.finalGrade : '';
        const proposed = segment.status === 'proposed' && workspaceState === 'action';
        const final = segment.id === 'final-gate' || segment.id === 'merge';
        return `<button type="button" class="weave-segment weave-segment--${displayedStatus} ${final ? 'weave-segment--final' : ''} ${segment.id === selected.id ? 'is-selected' : ''}" data-weave-segment="${segment.id}" style="--lane:${WEAVE_LANES.indexOf(segment.lane) + 1};--row:${segment.row + 1}"><small>${segment.lane} · workstream ${segment.row}</small><strong>${escapeHtml(label)}</strong>${proposed ? '<small>Proposed capability</small>' : grade ? `<span class="grade grade--${grade.toLowerCase()}">${grade}</span>` : ''}</button>`;
      };
      return `<section class="concept-workspace mission-weave" data-concept="weave" data-state="${workspaceState}">
        <aside class="weave-fleet"><small>Fleet workstreams</small><h2>Compact weave health</h2><p class="weave-state-note">${notes[workspaceState]}</p><ol class="weave-fleet-list"><li><button type="button" class="weave-fleet-row is-selected" data-weave-segment="${selected.id}"><strong>${escapeHtml(scenario.run.name)}</strong><span>${scenario.run.id} · two C grades · ${scenario.run.successors.length} held successors</span><i class="mini-weave" aria-label="Plan, Build, Verify, Gate, Settle miniature weave"><i></i><i></i><i></i><i></i><i></i></i></button></li><li><div class="weave-fleet-row"><strong>Queue drain reconciliation</strong><span>r309 · progressing · compacted</span><i class="mini-weave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></i></div></li></ol></aside>
        <main class="weave-main"><header><div><small>${scenario.run.id} · workstream logic</small><h2>Recovery mission weave</h2></div><span class="grade grade--c">C → C</span></header><p class="weave-caveat">Branches and joins describe contingent work, not a guaranteed pipeline: a verifier may reopen Build before any gate settles.</p><div class="weave-grid" aria-label="Plan, Build, Verify, Gate, and Settle workstream lanes">${WEAVE_LANES.map((lane, index) => `<section class="weave-lane" style="--lane:${index + 1}"><h3>${lane[0].toUpperCase() + lane.slice(1)}</h3></section>`).join('')}<svg class="weave-routes" viewBox="0 0 1000 380" preserveAspectRatio="none" aria-hidden="true"><path class="weave-route" d="M95 65 C175 65 190 65 290 65 M390 65 C475 65 490 65 590 65 M590 65 C500 160 410 170 290 175 M390 175 C475 175 490 175 590 175"/><path class="rework-loop" d="M590 175 C700 175 700 290 390 290"/><path class="weave-route weave-route--proposed" d="M390 290 C475 290 490 290 590 290"/><path class="weave-route" d="M590 290 C690 290 700 290 790 290 S890 290 965 290"/></svg>${visible.map(segmentCard).join('')}</div></main>
        <aside class="weave-detail" data-selected-object><small>Selected workstream segment</small><h2>${escapeHtml(selected.label)}</h2><p><b>${scenario.requirement.id} required</b> · ${escapeHtml(scenario.requirement.name)}</p><p>Evidence: ${scenario.evidence.missing.map(escapeHtml).join(' · ')}. Grade history: ${scenario.requirement.grades.join(' → ')}.</p><p>Canonical successors: ${scenario.run.successors.map((successor) => escapeHtml(successor.name)).join(' · ')}.</p><p class="final-invariant">Recovery invariants · ${workspaceState === 'outcome' ? `${scenario.outcome.finalGrade} · merged` : 'awaiting verified convergence'}</p></aside>
      </section>`;
    }
    const renderComparison = () => `<section class="slide" data-slide="comparison"><h1>Compare architectural trade-offs</h1></section>`;
    function announce(message) { document.querySelector('[data-live-region]').textContent = message; }
    function goToSlide(id) {
      if (!SLIDES.includes(id)) return;
      if (state.slide !== id) { state.slide = id; render(); announce(`Slide: ${id}`); }
      if (location.hash !== `#${id}`) location.hash = id;
    }
    function setWorkspaceState(id) { if (!WORKSPACE_STATES.includes(id)) return; state.workspaceState = id; render(); announce(`Workspace state: ${id}`); }
    function selectObject(concept, id) {
      if (!SLIDES.slice(1, -1).includes(concept)) return false;
      state.selectedByConcept[concept] = id;
      render();
      announce(`Selected ${id}`);
      return true;
    }
    function render() {
      const cartography = `<section class="slide" data-slide="cartography"><header><h1>Operational Cartography</h1>${state.slide === 'cartography' ? stateRail() : ''}</header>${renderCartography(SCENARIO, state.workspaceState, state.selectedByConcept.cartography)}</section>`;
      const causal = `<section class="slide" data-slide="causal"><header><h1>Causal Spine</h1>${state.slide === 'causal' ? stateRail() : ''}</header>${renderCausalSpine(SCENARIO, state.workspaceState, state.selectedByConcept.causal)}</section>`;
      const intervention = `<section class="slide" data-slide="intervention"><header><h1>Intervention Desk</h1>${state.slide === 'intervention' ? stateRail() : ''}</header>${renderInterventionDesk(SCENARIO, state.workspaceState, state.selectedByConcept.intervention)}</section>`;
      const evidence = state.slide === 'evidence' ? `<section class="slide" data-slide="evidence"><header><h1>Evidence Workbench</h1>${stateRail()}</header>${renderEvidenceWorkbench(SCENARIO, state.workspaceState, state.selectedByConcept.evidence)}</section>` : renderPlaceholderConcept('evidence', 'Evidence Workbench');
      const weave = state.slide === 'weave' ? `<section class="slide" data-slide="weave"><header><h1>Mission Weave</h1>${stateRail()}</header>${renderMissionWeave(SCENARIO, state.workspaceState, state.selectedByConcept.weave)}</section>` : renderPlaceholderConcept('weave', 'Mission Weave');
      const markup = [renderLoop(), cartography, causal, intervention, evidence, weave, renderComparison()].join('');
      document.querySelector('#slides').innerHTML = markup;
      document.querySelectorAll('[data-slide]').forEach((slide) => { slide.hidden = slide.dataset.slide !== state.slide; });
      document.querySelector('#slide-position').textContent = `${SLIDES.indexOf(state.slide) + 1} / ${SLIDES.length}`;
      document.querySelectorAll('[data-workspace-state]').forEach((button) => button.addEventListener('click', () => setWorkspaceState(button.dataset.workspaceState)));
    }
    document.querySelector('[data-action="previous-slide"]').addEventListener('click', () => goToSlide(SLIDES[Math.max(0, SLIDES.indexOf(state.slide) - 1)]));
    document.querySelector('[data-action="next-slide"]').addEventListener('click', () => goToSlide(SLIDES[Math.min(SLIDES.length - 1, SLIDES.indexOf(state.slide) + 1)]));
    document.addEventListener('click', (event) => {
      const actionTarget = event.target instanceof Element ? event.target.closest('[data-action="review-intervention"]') : null;
      if (actionTarget instanceof HTMLElement) {
        if (typeof globalThis.openDecisionModal === 'function') globalThis.openDecisionModal('intervention', '[data-action="review-intervention"]');
        else announce('Confirmation becomes available in the final interaction task');
        return;
      }
      const evidenceLayerTarget = event.target instanceof Element ? event.target.closest('[data-evidence-layer], [data-evidence-layer-close]') : null;
      if (evidenceLayerTarget instanceof HTMLElement) {
        const recordId = evidenceLayerTarget.dataset.evidenceLayerClose || evidenceLayerTarget.dataset.evidenceLayer || null;
        state.evidenceLayer = evidenceLayerTarget.hasAttribute('data-evidence-layer-close') ? null : recordId;
        render();
        if (state.evidenceLayer) document.querySelector(`#evidence-layer-${state.evidenceLayer}`)?.focus();
        else if (recordId) document.querySelector(`[data-evidence-layer="${recordId}"]`)?.focus();
        announce(state.evidenceLayer ? `Opened ${state.evidenceLayer} evidence detail` : 'Closed evidence detail');
        return;
      }
      const target = event.target instanceof Element ? event.target.closest('[data-concept="cartography"] [data-node-id], [data-concept="causal"] [data-event-id], [data-concept="intervention"] [data-case-id], [data-concept="evidence"] [data-claim-id], [data-concept="evidence"] [data-node-id], [data-concept="weave"] [data-weave-segment], [data-source-node-id], [data-source-requirement], [data-source-run]') : null;
      if (!(target instanceof HTMLElement)) return;
      if (target.dataset.sourceNodeId) { selectObject('cartography', target.dataset.sourceNodeId); goToSlide('cartography'); return; }
      if (target.hasAttribute('data-source-requirement')) { goToSlide('cartography'); document.querySelector('[data-requirement-id="R2"]')?.focus(); return; }
      if (target.hasAttribute('data-source-run')) { document.querySelector('[data-causal-run-record]')?.focus(); return; }
      if (target.dataset.nodeId) { selectObject('cartography', target.dataset.nodeId); if (target.closest('[data-concept="evidence"]')) goToSlide('cartography'); }
      if (target.dataset.eventId) selectObject('causal', target.dataset.eventId);
      if (target.dataset.caseId) selectObject('intervention', target.dataset.caseId);
      if (target.dataset.claimId) selectObject('evidence', target.dataset.claimId);
      if (target.dataset.weaveSegment) selectObject('weave', target.dataset.weaveSegment);
    });
    addEventListener('hashchange', () => {
      const id = SLIDES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'loop';
      if (state.slide === id) return;
      state.slide = id;
      render();
      announce(`Slide: ${id}`);
    });
    addEventListener('keydown', (event) => {
      const editableTarget = event.target instanceof Element && event.target.closest('input, textarea, select, [contenteditable]:not([contenteditable="false"])');
      if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || editableTarget || state.modal !== null) return;
      if (event.key === 'Escape' && state.evidenceLayer) { const recordId = state.evidenceLayer; state.evidenceLayer = null; render(); document.querySelector(`[data-evidence-layer="${recordId}"]`)?.focus(); announce('Closed evidence detail'); return; }
      if (event.key === 'ArrowLeft') goToSlide(SLIDES[Math.max(0, SLIDES.indexOf(state.slide) - 1)]);
      if (event.key === 'ArrowRight') goToSlide(SLIDES[Math.min(SLIDES.length - 1, SLIDES.indexOf(state.slide) + 1)]);
      if (/^[1-5]$/.test(event.key)) setWorkspaceState(WORKSPACE_STATES[Number(event.key) - 1]);
    });
    state.slide = SLIDES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'loop';
    window.taskWorldPresentation = Object.freeze({ getState: () => structuredClone(state), getEvidenceScenario: () => structuredClone({ requirements: SCENARIO.requirements, run: { successors: SCENARIO.run.successors } }), describeEvidenceGradeHistory, getLocatorSuccessorYs, goToSlide, setWorkspaceState, selectObject });
    try { render(); } catch (error) { document.body.innerHTML = `<main role="alert"><h1>Presentation could not start</h1><pre>${escapeHtml(error instanceof Error ? error.message : error)}</pre></main>`; }
  </script>
</body>
</html>
