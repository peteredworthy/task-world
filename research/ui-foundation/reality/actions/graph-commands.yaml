schema_version: "1"
key_namespace: provisional
actions:
  - key: action-graph-decision-approve
    implementation_status: present
    capability_status: current
    executable: true
    command: "REST POST /api/runs/{run_id}/graph/decisions using RecordDecisionCommand"
    actor_and_permission: "Caller supplies decider; optional JWT is not bound to it. Graph actor/context rules are domain eligibility, not product-role authorization."
    domain_eligibility: "Valid decision type/value and target kind/state; graph not cancelled/failed as command rules require."
    expected_source_version: "Client supplies no expected graph position; controller applies optimistic concurrency internally."
    input: "Node/decision target, typed approval or authority value, decider, optional scope/expiry/reason/record ID."
    validation: "Strict command schema plus graph target, actor, state, and decision validation."
    durable_effect: "Appends decision events/records; accepted approval can bind records, release lease, complete gate, and make successors ready."
    result_state: state-graph-node-completed
    transition: transition-graph-decision-approve
    failure_stale_race: "409 covers stale projection/command rejection; unique aggregate version is final concurrency backstop. Rejections return reason but not systematic refreshed recovery state."
    idempotency_retry: "No REST idempotency key; retry requires refreshed decision view and may be rejected after first application."
    reversibility: "No decision-reversal command."
    audit_evidence: "Graph event IDs/positions, decision record, refreshed decision view, scheduler/topology effects."
  - key: action-graph-decision-reject
    implementation_status: present
    capability_status: current
    executable: true
    command: "REST POST /api/runs/{run_id}/graph/decisions using RecordDecisionCommand"
    actor_and_permission: "Caller supplies decider; graph command context validates domain role/eligibility but no authenticated product-role policy exists."
    domain_eligibility: "Valid rejection value for an eligible graph approval/authority target."
    expected_source_version: "No client graph position; controller optimistic concurrency applies."
    input: "Typed rejected decision and target/decider fields."
    validation: "Strict schema and graph target/type/value/state rules."
    durable_effect: "Appends rejection decision; required rejected input can dead-end/fail the dependent gate and release work."
    result_state: state-graph-node-failed
    transition: transition-graph-decision-reject
    failure_stale_race: "Invalid/stale command returns conflict/rejection without a universal recovery object."
    idempotency_retry: "No request idempotency key; retry must first read current decision/node state."
    reversibility: "No reversal command; later corrective topology is separate if valid."
    audit_evidence: "Decision event/record, node/lease events, refreshed decision and scheduler views."
  - key: action-graph-patch
    implementation_status: present
    capability_status: current
    executable: true
    command: "REST POST /api/runs/{run_id}/graph/patch using SubmitPatchCommand"
    actor_and_permission: "REST stamps assumed human operator; this is not authenticated role enforcement. Graph patch role/validator checks are domain eligibility."
    domain_eligibility: "Graph run guard, permitted patch role/ops, topology/resource/final-invariant rules."
    expected_source_version: "Optional base_graph_position; stale base rejects only when intervening invalidating events touch patch read set."
    input: "Patch ID optional, strict operations, optional base position and rationale record."
    validation: "Strict Pydantic payload; macro normalization; patch validator rejects cycles, invalid ports/selectors, unauthorized ops, resource escalation, and invalid topology."
    durable_effect: "Accepted patch and topology/binding/repair events append atomically; projection remains active with changed topology."
    result_state: state-graph-active
    transition: transition-graph-patch
    failure_stale_race: "409 stale/rejected includes diagnostics/read-set differences for stale patch; future base acceptance behavior is unclear; append version constraint is final backstop."
    idempotency_retry: "Optional patch ID is not established as universal idempotency; retry needs current projection/base and may produce a new corrective patch."
    reversibility: "No rollback; only a later validated corrective patch may compensate."
    audit_evidence: "Patch-attempt projection, accepted/rejected graph events, diagnostics, created topology IDs, graph position."
  - key: action-outbox-requeue
    implementation_status: present
    capability_status: current
    executable: true
    command: "REST POST /api/runs/{run_id}/graph/outbox/requeue/{event_id}"
    actor_and_permission: "Fixed human-operator audit attribution; no action-specific authorization."
    domain_eligibility: "Exact event row belongs to run and is currently failed."
    expected_source_version: "No client row/event version; audit append has transactional stale-position handling."
    input: "Run ID and constrained event ID path."
    validation: "Path validation plus row ownership and failed-state checks."
    durable_effect: "One transaction resets outbox status/attempts/error/backoff and appends outbox_requeued; dispatcher may deliver at least once."
    result_state: state-outbox-pending
    transition: transition-outbox-requeue
    failure_stale_race: "404/409/422 for identity/state/input; stale audit append translates to conflict and enclosing transaction should roll back, though full endpoint race rollback is inferred."
    idempotency_retry: "Repeatable only after a subsequent failure; no idempotency key and downstream duplicate work depends on consumer idempotency."
    reversibility: "No undo; retrying side effects can duplicate work."
    audit_evidence: "outbox_requeued graph event, original error/attempt fields, row state, later dispatch evidence."
