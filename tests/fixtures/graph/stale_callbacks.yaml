- name: stale_duplicate_same_payload
  given_events:
    - node_created: {node_id: worker-stale-1, kind: worker, state: completed}
    - node_state_changed: {node_id: worker-stale-1, new_state: completed}
    - lease_granted: {node_id: worker-stale-1, lease_id: lease-1, generation: 1}
    - lease_released: {node_id: worker-stale-1, lease_id: lease-1}
    - callback_accepted: {node_id: worker-stale-1, lease_id: lease-1, lease_generation: 1, execution_id: exec-1, idempotency_key: key-1, payload: {payload_hash: hash-a}, reason: accepted}
  when_command:
    submit_callback: {node_id: worker-stale-1, execution_id: exec-1, lease_id: lease-1, lease_generation: 1, base_snapshot_id: S0, observed_graph_position: 1, idempotency_key: key-1, payload_hash: hash-a}
  then_events:
    - callback_duplicate_returned: {node_id: worker-stale-1, idempotency_key: key-1}
  then_projection: {worker-stale-1: completed, lease-1: released}

