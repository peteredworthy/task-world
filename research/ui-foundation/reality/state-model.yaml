schema_version: "1"
phase_status: synthesized-provisional
completion_phase: 1
key_namespace: provisional
scope: "Mode-qualified command states only; graph nodes, legacy tasks, run rows, and outbox rows are distinct carriers."
items:
  - {key: state-run-draft, carrier: legacy-run-row, value: draft, mode: legacy, terminal: false, status: implemented}
  - {key: state-run-active, carrier: run-row, value: active, mode: [legacy, graph], terminal: false, status: implemented}
  - {key: state-run-stopping, carrier: legacy-run-row, value: stopping, mode: legacy, terminal: false, status: implemented}
  - {key: state-run-paused, carrier: run-row, value: paused, mode: [legacy, graph], terminal: false, status: implemented}
  - {key: state-run-completed, carrier: run-row, value: completed, mode: [legacy, graph], terminal: true, status: implemented}
  - {key: state-run-failed, carrier: run-row, value: failed, mode: [legacy, graph], terminal: conditional, status: implemented, note: "Graph supports a qualified failed reopen; legacy lifecycle resume does not."}
  - {key: state-run-cancelled, carrier: run-row, value: cancelled, mode: [legacy, graph], terminal: true, status: implemented}
  - {key: state-task-building, carrier: legacy-task, value: building, mode: legacy, terminal: false, status: implemented}
  - {key: state-task-pending-user, carrier: legacy-task, value: pending_user_action, mode: legacy, terminal: false, status: implemented}
  - {key: state-task-verifying, carrier: legacy-task, value: verifying, mode: legacy, terminal: false, status: implemented}
  - {key: state-task-recovering, carrier: legacy-task, value: recovering, mode: legacy, terminal: false, status: implemented}
  - {key: state-task-completed, carrier: legacy-task, value: completed, mode: legacy, terminal: true, status: implemented}
  - {key: state-task-failed, carrier: legacy-task, value: failed, mode: legacy, terminal: true, status: implemented}
  - {key: state-step-awaiting-approval, carrier: legacy-step-approval, value: pending_human_approval, mode: legacy, terminal: false, status: implemented}
  - {key: state-step-approved, carrier: legacy-step-approval, value: approved, mode: legacy, terminal: false, status: implemented}
  - {key: state-graph-queued, carrier: graph-run, value: queued, mode: graph, terminal: false, status: implemented}
  - {key: state-graph-active, carrier: graph-run, value: active, mode: graph, terminal: false, status: implemented}
  - {key: state-graph-pausing, carrier: graph-run, value: pausing, mode: graph, terminal: false, status: implemented}
  - {key: state-graph-paused, carrier: graph-run, value: paused, mode: graph, terminal: false, status: implemented}
  - {key: state-graph-failed, carrier: graph-run, value: failed, mode: graph, terminal: conditional, status: implemented}
  - {key: state-graph-node-waiting-decision, carrier: graph-node, value: human_or_authority_gate_pending, mode: graph, terminal: false, status: implemented}
  - {key: state-graph-node-completed, carrier: graph-node, value: completed, mode: graph, terminal: true, status: implemented}
  - {key: state-graph-node-failed, carrier: graph-node, value: failed, mode: graph, terminal: true, status: implemented}
  - {key: state-outbox-failed, carrier: graph-outbox-row, value: failed, mode: graph, terminal: false, status: implemented}
  - {key: state-outbox-pending, carrier: graph-outbox-row, value: pending, mode: graph, terminal: false, status: implemented}
transitions:
  - {key: transition-legacy-start, from: state-run-draft, to: state-run-active, trigger: RUN_START signal consumption, rejection: "Any non-draft source is rejected by the domain transition."}
  - {key: transition-legacy-pause-request, from: state-run-active, to: state-run-stopping, trigger: pause request acceptance, rejection: "STOPPING is rejected; other invalid lifecycle sources are rejected."}
  - {key: transition-legacy-pause-applied, from: state-run-stopping, to: state-run-paused, trigger: PAUSE signal consumption, rejection: "Stale or invalid queued signal is discarded/acknowledged rather than applied."}
  - {key: transition-legacy-resume, from: state-run-paused, to: state-run-active, trigger: RESUME signal consumption, rejection: "Failed legacy runs are not lifecycle-resumable."}
  - {key: transition-legacy-cancel, from: [state-run-active, state-run-stopping, state-run-paused], to: state-run-cancelled, trigger: CANCEL signal consumption, rejection: "Illegal/terminal sources reject; acceptance is not application."}
  - {key: transition-legacy-clarification-answer, from: state-task-pending-user, to: state-task-building, trigger: accepted clarification response, rejection: "Stale response conflicts and must not reopen an advanced task."}
  - {key: transition-legacy-approve-task, from: state-task-pending-user, to: state-task-completed, trigger: accepted task approval, rejection: "Only an approval-pending task is eligible."}
  - {key: transition-legacy-reject-task, from: state-task-pending-user, to: state-task-building, trigger: accepted task rejection with attempts remaining, rejection: "At attempt limit the result is task-failed, not this edge."}
  - {key: transition-legacy-recovery-retry, from: state-task-recovering, to: state-task-building, trigger: accepted recovery outcome retry, rejection: "Only recovering tasks accept recovery outcomes."}
  - {key: transition-legacy-step-approve, from: state-step-awaiting-approval, to: state-step-approved, trigger: recorded step approval, rejection: "Only the current actionable gated step is eligible."}
  - {key: transition-graph-start, from: state-graph-queued, to: state-graph-active, trigger: graph start command, rejection: "Only queued graph runs start."}
  - {key: transition-graph-pause-begin, from: state-graph-active, to: state-graph-pausing, trigger: graph pause command, rejection: "Only active graph runs begin pausing."}
  - {key: transition-graph-pause-complete, from: state-graph-pausing, to: state-graph-paused, trigger: graph pause command, rejection: "Only pausing graph runs complete pause."}
  - {key: transition-graph-resume, from: [state-graph-paused, state-graph-failed], to: state-graph-active, trigger: qualified graph resume, rejection: "Failed reopen requires graph human/operator domain eligibility."}
  - {key: transition-graph-decision-approve, from: state-graph-node-waiting-decision, to: state-graph-node-completed, trigger: accepted approval/authority decision, rejection: "Invalid target/type/value, stale projection, or actor/domain rule rejects."}
  - {key: transition-graph-decision-reject, from: state-graph-node-waiting-decision, to: state-graph-node-failed, trigger: rejected required approval, rejection: "Invalid target/type/value, stale projection, or actor/domain rule rejects."}
  - {key: transition-graph-patch, from: state-graph-active, to: state-graph-active, trigger: accepted topology patch, rejection: "Validator rejection or stale conflicting read set leaves topology unchanged."}
  - {key: transition-outbox-requeue, from: state-outbox-failed, to: state-outbox-pending, trigger: accepted outbox requeue, rejection: "Missing, cross-run, or non-failed row rejects."}
invariants:
  - "Run-row state does not establish graph topology or legacy task state."
  - "Queued lifecycle acceptance and applied resulting state are separate observations."
  - "A graph node is not a legacy task; no transition aliases their state vocabularies."
  - "A rejection preserves the source carrier state unless its cited command explicitly emits a different rejection outcome."
