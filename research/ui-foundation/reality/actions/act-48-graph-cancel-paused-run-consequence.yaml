id: ACT-48
implementation_status: present
capability_status: current
executable: true
command_id: CMD-6
actor: REST caller; graph cancellation is a mode-specific consequence and does not grant a product role.
permission_requirements:
- PER-1
- PER-2
- PER-3
- PER-4
preconditions:
- ACT-21 accepted REST cancellation from a paused legacy row.
- The run is graph mode and its graph run is cancelling.
expected_source_version: The REST cancel request has no client run or graph version; its acceptance is source-preserving on
  the legacy row while graph cancellation applies separately.
required_input:
  run_id: required
validation:
- CMD-6 legacy cancel state validation and signal enqueue
- PER-4 graph cancellation lifecycle validation
durable_effect: The graph cancellation consequence transitions the graph-run carrier from cancelling to cancelled before the
  later legacy-row consumer application.
resulting_state_id: STA-25
failure_modes:
- 404 missing run/graph
- 409 stopping or illegal cancellation state
- executor cancellation failure
stale_state_behavior: REST acceptance can be redelivered or encounter an already-applied lifecycle state; it does not cross
  from graph run to legacy row state.
idempotency: No idempotency key; lifecycle/domain state makes a repeat after cancellation ineligible or a no-op at its consumer
  boundary.
retry_behavior: Read graph run and legacy activity projections; do not infer graph completion from the REST 202 acceptance
  alone.
reversibility: No direct uncancel; recovery is separate and does not undo graph cancellation.
