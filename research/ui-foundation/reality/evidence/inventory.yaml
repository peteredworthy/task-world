    decision carriers as implemented, with inspected-test coverage where cited; the
    current Phase 1 snapshot hash-guards cited implementation/test sources; any later
    source change invalidates this assessment until the hash snapshot is refreshed.
    Cross-carrier receipts, actor binding, and result-state coverage remain partial/unknown.
  epistemic_limits: Recorded actor text or a successful acceptance response does not
    prove authorization, resulting state, or causal downstream effect.
