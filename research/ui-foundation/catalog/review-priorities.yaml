schema_version: '1'
methodology:
  downstream_dependency_count: Exact count of the unresolved question's stated affected_ids; this makes the blast radius
    explicit rather than deriving it in the selector.
  authority_risk: 'Adjudicated ordinal: 0 none, 1 local contract interpretation, 2 persisted identity or ownership, 3
    cross-mode selection, write, recovery, or product-role authority.'
  capability_impact: 'Adjudicated ordinal: 0 none, 1 localized semantic boundary, 2 multiple user-visible or cross-mode
    boundaries, 3 broad direct capability and action surface.'
items:
- id: Q-1
  downstream_dependency_count: 4
  authority_risk: 2
  capability_impact: 2
  basis: Canonical attempt identity controls one persisted entity and three identity relationships, affecting ownership
    and attempt-facing behavior across their consumers.
- id: Q-2
  downstream_dependency_count: 3
  authority_risk: 3
  capability_impact: 2
  basis: Typed conversion joins two entities and one relationship across task, region, node, and attempt modes; the
    selection contract determines which identity is authoritative across those modes.
- id: Q-3
  downstream_dependency_count: 3
  authority_risk: 3
  capability_impact: 1
  basis: The two authority entities and their recovery relationship determine which durable store is authoritative for
    normal writes, with a localized persistence capability boundary.
- id: Q-4
  downstream_dependency_count: 6
  authority_risk: 3
  capability_impact: 2
  basis: Live-WAL backup and replay spans three persistence entities and three recovery relationships; unsafe authority
    handling can invalidate backup and restore behavior.
- id: Q-5
  downstream_dependency_count: 73
  authority_risk: 3
  capability_impact: 3
  basis: Product-role authorization directly spans seven permissions, four capability records, and sixty-two mutating
    action contracts, making it the broadest authority and capability boundary.
