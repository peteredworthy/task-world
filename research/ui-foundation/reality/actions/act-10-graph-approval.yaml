id: ACT-10
implementation_status: present
capability_status: unknown
executable: true
command_id: CMD-11
actor: Caller-supplied decider; the decision record preserves that attribution without binding it to an authenticated subject.
permission_requirements:
- PER-1
- PER-2
- PER-4
preconditions:
- A graph exists and its run is not cancelled or failed.
- The target is an eligible nonterminal approval gate.
- The request value is approved.
expected_source_version: The REST request has no client graph position; the controller reads the current position and its
  transaction/append checks detect a concurrent advance.
required_input:
  decision_type: approval
  value: approved
  target_node_id: required
  decider: required
  scope: optional
  expiry: optional
  reason: optional
  record_id: optional
command_variant:
  discriminator: decision_type
  decision_type: approval
  value: approved
validation:
- RecordDecisionCommand strictly validates decision type/value and the approval target kind.
- PER-4 graph command domain eligibility validates graph state, target terminality, and actor/context shape.
durable_effect: Appends approval_decision_recorded and projects a DecisionRecord; accepted approval then binds the decision
  input, releases the scoped lease when present, and completes the target node.
resulting_state_id: STA-37
failure_modes:
- 404 when no graph exists
- 409 for stale append or command rejection
- 422 for an invalid decision payload, target, or value
stale_state_behavior: The client cannot supply a graph position. A race detected by the controller transaction or append returns
  409 with a rejection reason; it does not create a generic rejection state.
idempotency: No REST idempotency key is established. A caller retries only after reading the decision/node projection; duplicate
  semantics are command-state dependent.
retry_behavior: Refresh the graph decision and node projections, then submit only a still-eligible decision; do not assume
  an accepted response is a reusable receipt.
reversibility: No decision-reversal command exists. A later valid graph command may create a new effect but is not an undo
  of this decision.
audit_evidence_ids:
- EVD-27
transition:
  from_state_id: STA-36
  to_state_id: STA-37
carrier_relationship:
  kind: same-command decision carrier
  paired_node_outcome_action_id: ACT-41
  node_transition:
    from_state_ids: [STA-71, STA-72, STA-29, STA-30, STA-31, STA-32]
    to_state_id: STA-33
  ordering: One CMD-11 command records the decision and separately projects the node outcome; this is not a STA-37-to-node
    edge.
enforced_authentication: PER-1 optional global valid-bearer gate.
enforced_authorization: absent
domain_eligibility: PER-4 graph decision target, state, actor/context, and value validation.
proposed_role_policy: null
conflict_ids: []
question_ids: [Q-5]
test_status: unexercised
