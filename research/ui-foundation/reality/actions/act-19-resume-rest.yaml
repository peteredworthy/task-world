id: ACT-19
title: Resume run through REST
definition: Accept a REST resume signal while preserving the paused legacy row until later consumer application.
implementation_status: present
capability_status: unknown
executable: true
command_id: CMD-5
actor: caller
permission_requirements:
- PER-1
- PER-2
- PER-3
preconditions:
- legacy run is paused
- resume runner and strategy are valid when supplied
expected_source_version: No client run version.
required_input:
  run_id: required
  runner: optional
  runner_config: optional
  strategy: continue|reset_worktree; optional
validation:
- legacy lifecycle state validation
- resume runner/config validation
- resume strategy validation
durable_effect: Appends resume signal acceptance evidence and queues RESUME while the row remains paused; the consumer later
  applies paused to active.
resulting_state_id: STA-4
failure_modes:
- 404 missing run
- 409 stopping or illegal transition
- 422 invalid resume request
- 503 runner unavailable
stale_state_behavior: Accepted RESUME preserves paused until consumer application; a stale or already-applied redelivery is
  acknowledged or discarded without a typed result receipt.
idempotency: State-validated; no idempotency key. A repeated request after application is no longer eligible.
retry_behavior: Poll row status and activity before retrying; reset_worktree can discard file state and is not retry-safe
  restoration.
reversibility: Pause is a separate later action; reset_worktree effects are not undone by resume.
audit_evidence_ids:
- EVD-7
- EVD-19
- EVD-38
- EVD-39
- EVD-40
transition:
  from_state_id: STA-4
  to_state_id: STA-4
eventual_applied_transition:
  from_state_id: STA-4
  to_state_id: STA-2
  evidence_ids:
  - EVD-7
enforced_authentication: Optional global valid-bearer gate; disabled by default.
enforced_authorization: absent
domain_eligibility: Legacy row must be paused; graph failed reopening remains separately mode-qualified.
proposed_role_policy: null
conflict_ids: []
question_ids: []
test_status: unexercised
