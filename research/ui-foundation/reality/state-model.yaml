carrier_synchronization:
- REST lifecycle acceptance is command evidence and commonly source-preserving; the
  signal consumer later applies the row transition.
- Graph cancellation transitions graph-run cancelling to graph-run cancelled; affected
  graph nodes separately transition from their own leased, running, or suspended carrier
  to cancelled before the consumer separately applies legacy row cancellation. No
  cross-carrier transition is declared.
- Graph completion and failure, legacy row completion and failure, graph node outcomes,
  and decision records are separately observed carriers, not aliases.
- Carrier-local result states document the durable or projected result of the routed
  family; they do not form a universal applied/rejected receipt.
- Fan-out retry changes the failed child to legacy task pending and separately preserves
  the parent fan-out-running carrier; no one resulting state represents both rows.
- Transition-back preserves its eligible legacy run row while separately resetting
  affected non-completed tasks to pending. Run recovery separately moves failed or
  paused rows to paused, targets a task for building, and resets downstream tasks
  to pending.
- The REST lifecycle routes inspected reject STOPPING for pause, resume, cancel, and
  recover. No stopping-to-stopping acceptance transition is declared.
- Graph decision pending-to-recorded and graph node command outcomes are separate
  carrier-local effects. RecordDecisionCommand rejects terminal graph nodes and completes
  every eligible nonterminal target, except a rejected approval, which fails its target;
  decision recording does not transition a graph node.
- Graph patch submission preserves graph active on the separate graph-run carrier.
  Submitted patches transition to accepted or rejected patch-attempt carriers; budget
  rejection can separately create a ready gate.
- Graph node readiness, leasing, running, suspension, retirement, and cancellation
  are node-local NodeState transitions. Graph-run active or paused may independently
  enter cancelling; cancellation does not use planned or blocked as a substitute for
  an already leased, running, or suspended node.
- Accepted CMD-12 retire_node patches may produce the explicitly listed node-retirement
  edges only from planned, blocked, ready, or suspended nodes; leased and running
  nodes are rejected by the patch validator. Terminal-node behavior is not promoted
  to a broad transition because the result catalog only records meaningful source-state
  changes.
- Reconciliation retirement is a separate internal terminal-evidence mechanism with
  its own listed eligible node states; it is neither CMD-12 nor a graph patch-attempt
  (`STA-54`) result.
- The qualified run-recovery command can reset completed downstream legacy tasks to
  pending; this does not make ordinary completed-task transitions nonterminal.
