<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Task World: Five JTBD UI Approaches</title>
  <style>
    :root {
      --ink: #dce8f1; --muted: #7890a3; --ground: #06121a; --panel: #091923;
      --line: #284354; --verified: #38bda8; --blocking: #fb7185;
      --waiting: #eeb25a; --context: #416074; --focus: #8ee8d8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--ground); color: var(--ink); }
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    button { font: inherit; }
    button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; top: 0; left: 0; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
    .presentation { min-height: 100vh; display: grid; grid-template-rows: 42px 1fr 38px; }
    .slide { min-height: 0; overflow: auto; padding: 18px; }
    .deck-nav, .deck-footer { display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-color: var(--line); background: #081721; }
    .deck-nav { border-bottom: 1px solid var(--line); }
    .deck-footer { border-top: 1px solid var(--line); }
    .state-rail { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; width: 100%; }
    .state-rail button { min-width: 0; }
    .state-rail button[aria-pressed="true"] { color: var(--ink); border-color: var(--focus); }
    .concept-workspace.cartography { display: grid; grid-template-columns: minmax(150px, .6fr) minmax(360px, 1.6fr) minmax(330px, 1fr); min-height: min(680px, calc(100vh - 142px)); border: 1px solid var(--line); background: var(--panel); overflow: hidden; }
    .fleet-rail, .selection-inspector { padding: 14px; background: #081721; }
    .fleet-rail { border-right: 1px solid var(--line); }
    .fleet-ribbon { display: flex; height: 20px; overflow: hidden; border-radius: 3px; margin: 8px 0 12px; }
    .fleet-ribbon i { display: grid; place-items: center; flex: var(--share); min-width: 18px; color: #06121a; font: 800 11px ui-monospace, monospace; font-style: normal; }
    .fleet-ribbon i:nth-child(1) { background: var(--blocking); }.fleet-ribbon i:nth-child(2) { background: var(--verified); }.fleet-ribbon i:nth-child(3) { background: var(--waiting); }
    .fleet-rail ol { padding: 0; margin: 0; list-style: none; }.fleet-rail li { padding: 9px; border-left: 3px solid var(--blocking); background: #102430; }.fleet-rail b, .fleet-rail span { display: block; }.fleet-rail span { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .graph-map { position: relative; min-height: 480px; overflow: hidden; background-image: linear-gradient(rgba(65,96,116,.14) 1px, transparent 1px), linear-gradient(90deg, rgba(65,96,116,.14) 1px, transparent 1px); background-size: 28px 28px; }
    .graph-routes { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }.graph-route { fill: none; stroke-width: 5; }.route--verified { stroke: var(--verified); }.route--blocking { stroke: var(--blocking); }.route--proposed { stroke: var(--waiting); stroke-dasharray: 9 7; }
    .graph-node { position: absolute; left: var(--x); top: var(--y); width: min(150px, 27%); transform: translate(-50%, -50%); padding: 9px; border: 1px solid #416074; border-radius: 6px; background: #0b1b26; color: var(--ink); text-align: left; cursor: pointer; }.graph-node small, .graph-node strong { display: block; }.graph-node small { color: var(--muted); font: 700 10px ui-monospace, monospace; }.graph-node strong { margin: 5px 0; font-size: 12px; }.graph-node.is-selected { border: 2px solid var(--focus); box-shadow: 0 0 0 4px rgba(142,232,216,.14); }
    .grade { display: inline-block; padding: 2px 5px; border-radius: 3px; font: 800 11px ui-monospace, monospace; }.grade--c { color: #ffd0d8; background: #6f2c34; }.grade--pending { color: #332508; background: var(--waiting); }
    .selection-inspector { min-width: 0; border-left: 1px solid var(--line); }.selection-inspector > small { color: var(--muted); font: 700 11px ui-monospace, monospace; }.selection-inspector h2 { margin: 6px 0; font-size: 18px; }.selection-inspector p { line-height: 1.4; }.selection-inspector p b { color: var(--focus); }.selected-node-summary { padding-bottom: 10px; }.selected-node-summary strong, .selected-node-summary small { display: block; }.selected-node-summary strong { font-size: 16px; }.selected-node-summary small { margin-top: 3px; color: var(--muted); font: 700 10px ui-monospace, monospace; }
    .node-stat-table { max-height: 340px; overflow: auto; border: 1px solid var(--line); }.node-stat-head, .node-stat-row { display: grid; grid-template-columns: minmax(140px, 1fr) 48px 44px 70px 58px; gap: 5px; align-items: center; width: 100%; }.node-stat-head { position: sticky; top: 0; z-index: 1; padding: 8px; background: #102430; color: var(--muted); font: 700 9px ui-monospace, monospace; }.node-stat-row { padding: 8px; border-top: 1px solid #1b3546; background: #091923; color: var(--ink); text-align: left; }.node-stat-row:hover { background: #102430; }.node-stat-row small { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }.node-stat-activate { width: 100%; padding: 0; border: 0; background: transparent; color: inherit; text-align: left; cursor: pointer; }.capability { border-left: 3px solid var(--waiting); padding: 8px; background: #201b10; color: #f5d99e; }.exception-step { margin: 0; padding: 10px 0; border-top: 1px solid var(--line); }.exception-step h2, .exception-step h3 { margin: 3px 0 6px; }.exception-step h2 { font-size: 17px; }.exception-step h3, .exception-step small { color: var(--muted); font: 700 10px ui-monospace, monospace; }
    .cartography[data-state="fleet"] .fleet-rail, .cartography[data-state="position"] .graph-map, .cartography[data-state="cause"] .selection-inspector, .cartography[data-state="action"] .capability, .cartography[data-state="outcome"] .node-stat-table { box-shadow: inset 0 0 0 1px var(--focus); }
    .cartography[data-state="fleet"] { grid-template-columns: minmax(180px, .85fr) minmax(320px, 1.35fr) minmax(300px, .9fr); }.cartography[data-state="position"] { grid-template-columns: minmax(130px, .45fr) minmax(440px, 1.9fr) minmax(280px, .8fr); }.cartography[data-state="cause"] { grid-template-columns: minmax(130px, .45fr) minmax(340px, 1.3fr) minmax(350px, 1.25fr); }.cartography[data-state="action"] { grid-template-columns: minmax(130px, .45fr) minmax(340px, 1.2fr) minmax(360px, 1.35fr); }.cartography[data-state="outcome"] { grid-template-columns: minmax(130px, .45fr) minmax(340px, 1.15fr) minmax(360px, 1.4fr); }
    @media (max-width: 720px) {
      .slide { padding: 8px; }
      .deck-nav, .deck-footer { gap: 4px; padding: 0 6px; font-size: 10px; }
      .deck-nav strong { min-width: 0; line-height: 1.1; }
      .deck-nav nav { display: flex; flex: none; }
      .deck-nav button { padding: 2px 4px; }
      .state-rail { gap: 2px; font-size: 11px; }
      .state-rail button { padding: 3px 1px; }
      .concept-workspace.cartography { grid-template-columns: 1fr; }.fleet-rail, .selection-inspector { border: 0; border-bottom: 1px solid var(--line); }.graph-map { min-height: 390px; }.node-stat-head, .node-stat-row { grid-template-columns: minmax(124px, 1fr) 40px 35px 54px 48px; font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <main class="presentation" data-presentation aria-label="Task World UI concept presentation">
    <header class="deck-nav">
      <strong>TASK WORLD / JTBD INTERFACE STUDY</strong>
      <nav aria-label="Slide navigation">
        <button type="button" data-action="previous-slide">Previous</button>
        <button type="button" data-action="next-slide">Next</button>
      </nav>
    </header>
    <div id="slides"></div>
    <footer class="deck-footer"><span id="slide-position"></span><span>←/→ slides · 1–5 workspace state</span></footer>
    <p class="sr-only" data-live-region aria-live="polite"></p>
  </main>
  <script>
    'use strict';
    const WORKSPACE_STATES = Object.freeze(['fleet', 'position', 'cause', 'action', 'outcome']);
    const SLIDES = Object.freeze(['loop', 'cartography', 'causal', 'intervention', 'evidence', 'weave', 'comparison']);
    const SCENARIO = Object.freeze({
      fleet: Object.freeze({ active: 10, attention: 2, progressing: 7, waiting: 1, pricedCoverage: 94 }),
      run: Object.freeze({ id: 'r314', name: 'Suspension replay recovery', health: 'degraded', cost: 4.82, retryCost: 1.05, attemptsLeft: 1, blockedSuccessors: 3 }),
      requirement: Object.freeze({ id: 'R2', name: 'Recovery resumes suspended work exactly once after executor restart', required: true, grades: Object.freeze(['C', 'C']) }),
      nodes: Object.freeze([
        Object.freeze({ id: 'N14', name: 'Implement replay boundary', kind: 'builder', attempt: 1, grade: 'C', files: 8, newEvidence: 0, cost: 0.72 }),
        Object.freeze({ id: 'N15', name: 'Verify suspension replay', kind: 'verifier', attempt: 1, grade: 'C', files: null, newEvidence: 0, cost: 0.19 }),
        Object.freeze({ id: 'N17', name: 'Revise recovery path', kind: 'builder', attempt: 2, grade: 'C', files: 3, newEvidence: 0, cost: 1.05 }),
        Object.freeze({ id: 'N18', name: 'Recheck replay proof', kind: 'verifier', attempt: 2, grade: 'C', files: null, newEvidence: 0, cost: 0.21 }),
        Object.freeze({ id: 'N24', name: 'Add incident evidence', kind: 'builder', attempt: 3, grade: null, files: 0, newEvidence: 2, cost: 0.62, proposed: true }),
      ]),
      evidence: Object.freeze({ missing: Object.freeze(['Deterministic suspension replay', 'Incident record INC-042']), changedFiles: 3, additions: 84, deletions: 21 }),
      outcome: Object.freeze({ finalGrade: 'A', merged: true, avoidedRetryCost: 1.05, learning: 'Promote restart replay fixture into the routine packet' }),
    });
    const state = { slide: 'loop', workspaceState: 'fleet', selectedByConcept: { cartography: 'N18', causal: 'verdict-a2', intervention: 'case-r314', evidence: 'R2', weave: 'recovery-verify-a2' }, modal: null };
    const escapeHtml = (value) => String(value).replace(/[&<>"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[character]);
    const stateRail = () => `<nav class="state-rail" aria-label="Operating loop state">${WORKSPACE_STATES.map((id, index) => `<button type="button" data-workspace-state="${id}" aria-pressed="${state.workspaceState === id}">${index + 1} ${id === 'cause' ? 'Cause / Evidence' : id[0].toUpperCase() + id.slice(1)}</button>`).join('')}</nav>`;
    const renderLoop = () => `<section class="slide" data-slide="loop"><h1>One operating loop, five interface models</h1><p>Notice → position → decide or explain → verify → act → learn → compare.</p></section>`;
    const renderPlaceholderConcept = (id, title) => `<section class="slide" data-slide="${id}"><header><h1>${title}</h1>${state.slide === id ? stateRail() : ''}</header><div class="concept-workspace" data-concept="${id}"></div></section>`;
    function renderNodeRows(nodes) {
      return `<div class="node-stat-table" role="table" aria-label="Nodes touching selected requirement">
        <div class="node-stat-head" role="row"><span role="columnheader">Node / attempt</span><span role="columnheader">Grade</span><span role="columnheader">Files</span><span role="columnheader">New evidence</span><span role="columnheader">Cost</span></div>
        ${nodes.map((node) => `<div class="node-stat-row" role="row" data-node-stat-row>
          <span role="rowheader"><button type="button" class="node-stat-activate" data-node-id="${node.id}"><strong>${escapeHtml(node.name)}</strong><small>${node.id} · ${node.kind} · attempt ${node.attempt}</small></button></span>
          <span role="cell" class="grade grade--${(node.grade || 'pending').toLowerCase()}">${node.grade || '—'}</span>
          <span role="cell">${node.files ?? '—'}</span><span role="cell">${node.newEvidence > 0 ? `+${node.newEvidence}` : node.newEvidence}</span><span role="cell">$${node.cost.toFixed(2)}</span>
        </div>`).join('')}
      </div>`;
    }
    function renderCartography(scenario, workspaceState, selectedId) {
      const selected = scenario.nodes.find((node) => node.id === selectedId) || scenario.nodes[3];
      return `<section class="concept-workspace cartography" data-concept="cartography" data-state="${workspaceState}">
        <aside class="fleet-rail"><div class="fleet-ribbon" role="img" aria-label="${scenario.fleet.attention} need attention, ${scenario.fleet.progressing} progressing, ${scenario.fleet.waiting} waiting"><i style="--share:${scenario.fleet.attention}">${scenario.fleet.attention}</i><i style="--share:${scenario.fleet.progressing}">${scenario.fleet.progressing}</i><i style="--share:${scenario.fleet.waiting}">${scenario.fleet.waiting}</i></div><ol><li><b class="fleet-run-name">${escapeHtml(scenario.run.name)}</b><span class="fleet-run-meta">${scenario.run.id} · grade ${scenario.requirement.grades[0]} repeated ×${scenario.requirement.grades.length} · ${scenario.run.blockedSuccessors} blocked</span></li></ol></aside>
        <div class="graph-map" aria-label="Issue neighborhood for ${escapeHtml(scenario.requirement.name)}">
          <svg class="graph-routes" viewBox="0 0 800 500" aria-hidden="true"><path class="graph-route route--verified" d="M90 160 C190 160 210 230 315 230"/><path class="graph-route route--blocking" d="M315 230 C470 160 520 150 650 160"/><path class="graph-route route--blocking" d="M315 230 C470 280 520 330 650 340"/><path class="graph-route route--proposed" d="M315 230 C330 330 360 390 430 420"/></svg>
          ${scenario.nodes.map((node, index) => `<button type="button" class="graph-node ${node.id === selected.id ? 'is-selected' : ''}" data-node-id="${node.id}" style="--x:${[8,34,66,68,36][index]}%;--y:${[25,38,20,58,75][index]}%"><small>${node.id} · ${node.kind}</small><strong>${escapeHtml(node.name)}</strong><span class="grade grade--${(node.grade || 'pending').toLowerCase()}">${node.grade || '—'}</span></button>`).join('')}
        </div>
        <aside class="selection-inspector" data-selected-object><div class="selected-node-summary" data-selected-node-summary><small>Selected node</small><strong>${escapeHtml(selected.name)}</strong><small>${selected.id} · ${selected.kind} · attempt ${selected.attempt}</small></div><section class="exception-step" data-exception-step="constraint"><small>Constraint</small><h2>${escapeHtml(scenario.requirement.name)}</h2><p data-requirement-id="${scenario.requirement.id}"><b><span>${scenario.requirement.id}</span> · required</b></p></section><section class="exception-step" data-exception-step="evidence"><small>Evidence</small><h3>Missing evidence and node history</h3><p>Missing: ${scenario.evidence.missing.map(escapeHtml).join(' · ')}. New evidence: +${scenario.nodes.reduce((total, node) => total + node.newEvidence, 0)} across ${scenario.evidence.changedFiles} changed files (+${scenario.evidence.additions}/−${scenario.evidence.deletions}).</p>${renderNodeRows(scenario.nodes)}</section><section class="exception-step" data-exception-step="consequence"><small>Consequence</small><p>${scenario.run.blockedSuccessors} blocked successors · $${scenario.run.retryCost.toFixed(2)} retry cost · ${scenario.run.attemptsLeft} attempt${scenario.run.attemptsLeft === 1 ? '' : 's'} left</p></section><section class="exception-step" data-exception-step="action"><small>Action</small><p class="capability capability--proposed">Proposed capability · bind ${scenario.evidence.missing.map(escapeHtml).join(' and ')}</p></section></aside>
      </section>`;
    }
    const renderComparison = () => `<section class="slide" data-slide="comparison"><h1>Compare architectural trade-offs</h1></section>`;
    function announce(message) { document.querySelector('[data-live-region]').textContent = message; }
    function goToSlide(id) {
      if (!SLIDES.includes(id)) return;
      if (state.slide !== id) { state.slide = id; render(); announce(`Slide: ${id}`); }
      if (location.hash !== `#${id}`) location.hash = id;
    }
    function setWorkspaceState(id) { if (!WORKSPACE_STATES.includes(id)) return; state.workspaceState = id; render(); announce(`Workspace state: ${id}`); }
    function selectObject(concept, id) {
      if (!SLIDES.slice(1, -1).includes(concept)) return false;
      state.selectedByConcept[concept] = id;
      render();
      announce(`Selected ${id}`);
      return true;
    }
    function render() {
      const cartography = `<section class="slide" data-slide="cartography"><header><h1>Operational Cartography</h1>${state.slide === 'cartography' ? stateRail() : ''}</header>${renderCartography(SCENARIO, state.workspaceState, state.selectedByConcept.cartography)}</section>`;
      const markup = [renderLoop(), cartography, renderPlaceholderConcept('causal', 'Causal Spine'), renderPlaceholderConcept('intervention', 'Intervention Desk'), renderPlaceholderConcept('evidence', 'Evidence Workbench'), renderPlaceholderConcept('weave', 'Mission Weave'), renderComparison()].join('');
      document.querySelector('#slides').innerHTML = markup;
      document.querySelectorAll('[data-slide]').forEach((slide) => { slide.hidden = slide.dataset.slide !== state.slide; });
      document.querySelector('#slide-position').textContent = `${SLIDES.indexOf(state.slide) + 1} / ${SLIDES.length}`;
      document.querySelectorAll('[data-workspace-state]').forEach((button) => button.addEventListener('click', () => setWorkspaceState(button.dataset.workspaceState)));
    }
    document.querySelector('[data-action="previous-slide"]').addEventListener('click', () => goToSlide(SLIDES[Math.max(0, SLIDES.indexOf(state.slide) - 1)]));
    document.querySelector('[data-action="next-slide"]').addEventListener('click', () => goToSlide(SLIDES[Math.min(SLIDES.length - 1, SLIDES.indexOf(state.slide) + 1)]));
    document.addEventListener('click', (event) => {
      const target = event.target instanceof Element ? event.target.closest('[data-concept="cartography"] [data-node-id]') : null;
      if (target instanceof HTMLElement) selectObject('cartography', target.dataset.nodeId);
    });
    addEventListener('hashchange', () => {
      const id = SLIDES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'loop';
      if (state.slide === id) return;
      state.slide = id;
      render();
      announce(`Slide: ${id}`);
    });
    addEventListener('keydown', (event) => {
      const editableTarget = event.target instanceof Element && event.target.closest('input, textarea, select, [contenteditable]:not([contenteditable="false"])');
      if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || editableTarget || state.modal !== null) return;
      if (event.key === 'ArrowLeft') goToSlide(SLIDES[Math.max(0, SLIDES.indexOf(state.slide) - 1)]);
      if (event.key === 'ArrowRight') goToSlide(SLIDES[Math.min(SLIDES.length - 1, SLIDES.indexOf(state.slide) + 1)]);
      if (/^[1-5]$/.test(event.key)) setWorkspaceState(WORKSPACE_STATES[Number(event.key) - 1]);
    });
    state.slide = SLIDES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'loop';
    window.taskWorldPresentation = Object.freeze({ getState: () => structuredClone(state), goToSlide, setWorkspaceState, selectObject });
    try { render(); } catch (error) { document.body.innerHTML = `<main role="alert"><h1>Presentation could not start</h1><pre>${escapeHtml(error instanceof Error ? error.message : error)}</pre></main>`; }
  </script>
</body>
</html>
