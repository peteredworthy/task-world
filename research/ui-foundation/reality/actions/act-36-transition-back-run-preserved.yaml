id: ACT-36
title: Preserve legacy run carrier during transition-back
definition: Transition-back preserves the legacy run row carrier while it rewinds current-step position.
implementation_status: present
capability_status: current
executable: true
command_id: CMD-34
actor: caller
permission_requirements:
- PER-3
preconditions:
- target step index is earlier than the current legacy step index
expected_source_version: No client run or step version
required_input:
  run_id: required
  target_step_index: required
  reason: optional
validation:
- legacy execution mode
- target step index bounds validation
- earlier-step validation
durable_effect: Records RunStepBackward and preserves the run carrier while changing current_step_index; paired task-reset
  effects are separate contracts.
resulting_state_id: STA-2
failure_modes:
- 404 run identity
- 409 target is current, forward, or out of bounds
stale_state_behavior: No expected version; concurrent step progression can make the requested target invalid.
idempotency: No idempotency key; repeating the same backward target is rejected once it is no longer earlier.
retry_behavior: Refresh run status and current_step_index before retrying.
reversibility: A later forward progression is not an inverse and does not restore external effects.
audit_evidence_ids:
- EVD-45
transition:
  from_state_id: STA-2
  to_state_id: STA-2
carrier_relationship:
  command_group: transition_back
  paired_effect_action_ids:
  - ACT-37
  affected_carrier: legacy run row; current_step_index
enforced_authentication: Optional global valid-bearer gate
enforced_authorization: absent
domain_eligibility: Legacy run with an earlier in-bounds target step.
proposed_role_policy: null
