- kind: file-state-boundary
  identity: file-state-<execution_id>, base/captured snapshot IDs, git commit/tree/ref, classified path sets, residue, rejection,
    and cleanup lineage.
  producer: Graph callback capture_file_state_boundary and file-state acceptance/rejection paths.
  persistence: Accepted/rejected file-state facts are durable graph records; referenced snapshots are immutable/restorable
    while their refs remain.
  attribution: Run, producer node, execution, and classified paths are retained.
  query_surface: Graph file-state report, node detail, and graph events.
  freshness: Fresh only at the captured callback boundary; later worktree state can differ.
  consistency: Capture is a whole-worktree observation; concurrent/cumulative writes mean node attribution is observer attribution,
    not exclusive authorship.
  missing_behavior: Normal producer does not emit diffstat or content hashes for ordinary tracked/untracked files; no node-only
    causal delta is established.
  current_availability: Reported by the approved bounded audit as implemented and covered by inspected tests for capture,
    classification, snapshot, rejection, cleanup, and report readback; implementation/test source freshness is not hash-guarded
    and no fresh test result is asserted. Diff/content and node-exclusive causality coverage remain absent.
  epistemic_limits: Snapshot/file classification supports a repository boundary observation, not a proof of which node caused
    each change.
