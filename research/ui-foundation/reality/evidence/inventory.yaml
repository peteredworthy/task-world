items:
- kind: workflow-event
  identity: events_v2 global position; (aggregate_id, version) is aggregate-local retry/order identity; no workflow event_id
    exists.
  producer: Workflow services, AttemptStore, and OutputBatcher through SqliteEventStore.append.
  persistence: Append-only SQL event row and synchronous SQL projections; JSONL is post-commit secondary output and may lag.
  attribution: run_id is required; task, attempt, requirement, and node fields are event-specific and may be absent.
  query_surface: GET /api/runs/{run_id}/activity is a selected, paginated activity projection, not a complete graph-inclusive
    ledger.
  freshness: Position is durable database order; timestamp is producer time. JSONL freshness is reconciled after committed
    SQL positions.
  consistency: Projection updates share the SQL append transaction; activity merges workflow events with only selected graph
    event families.
  missing_behavior: No workflow event UUID; no public complete cross-stream chronology; position alone supplies no causal
    mechanism.
  current_availability: Reported by the approved bounded audit as implemented and covered by inspected tests for SQL storage,
    projections, dual-output recovery, and activity readback; implementation/test source freshness is not hash-guarded and
    no fresh test result is asserted. Activity remains selected/paginated rather than complete cross-stream coverage.
  epistemic_limits: An event establishes an emitted fact and its typed payload, not that every related external effect occurred
    or that adjacent events are causal.
