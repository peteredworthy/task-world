  projection. Oversight creates no DecisionRecord or AuthorityDecisionRecord output
  record.
resulting_state_id: STA-37
failure_modes:
- 404 when no graph exists
- 409 for stale append or command rejection
- 422 for malformed or ineligible oversight input
