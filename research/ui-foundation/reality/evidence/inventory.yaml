- kind: transcript-and-tool-trace
  identity: Output events use workflow global position and line_offset; legacy action logs have sequenced parsed entries and
    tool IDs where supplied.
  producer: Runner on_output through OutputBatcher; runner parsers produce legacy ExecutionResult.action_log.
  persistence: Ordered agent_output events persist; legacy action log/final output persist to attempts and interaction rows;
    graph action log is extracted for usage then discarded.
  attribution: Output has run/task/attempt and graph node where applicable; legacy trace includes phase/runner, while graph
    lacks persisted structured tool-sequence identity.
  query_surface: Activity and legacy run-trace/task-detail surfaces; graph has carrier-dependent output lines but no canonical
    action-log query.
  freshness: Final flush is wired, but no canonical stream-complete marker establishes a complete transcript.
  consistency: Carrier formatting differs; compact activity pagination and omitted graph action logs prevent a uniform trace
    contract.
  missing_behavior: No complete transcript marker, graph structured action log, graph tool arguments/results, or all-run tool
    coverage.
  current_availability: Reported by the approved bounded audit as implemented with inspected-test coverage for persisted output
    and legacy parsed traces; implementation/test source freshness is not hash-guarded and no fresh test result is asserted.
    Graph structured action-log and complete-transcript coverage remain partial/unknown.
  epistemic_limits: A persisted line or parsed entry proves only retained adapter output; it cannot prove complete runner/model/tool
    activity.
