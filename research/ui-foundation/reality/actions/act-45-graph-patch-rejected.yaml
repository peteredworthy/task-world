resulting_state_id: STA-55
failure_modes:
- 404 when no graph exists
- 409 for stale/controller conflict or rejected patch
- 422 for malformed patch input
stale_state_behavior: Invalidating events touching a stale patch read set cause graph_patch_rejected with
  conflicting event IDs/read-set diagnostics; neutral or disjoint changes do not.
idempotency: Patch ID is not universal idempotency; rejected requests remain distinct patch-attempt evidence.
retry_behavior: Read the rejection diagnostics and current projection, then submit a newly valid corrective
  patch if appropriate.
reversibility: The rejected attempt preserves its source graph; no rollback is needed or implied.
