- kind: prompt-packet
  identity: 'Legacy: run/task/attempt/phase and stored text, with no prompt hash or
    packet ID. Graph: node/lease/generation/execution/base snapshot compact summary,
    with no independent packet ID.'
  producer: Legacy PhaseHandler/AttemptStore before phase execution; graph dispatch
    _execution_context and acknowledge-start summary.
  persistence: Legacy full prompts can be stored on attempts and interaction rows;
    graph persists only compact start-event summary, not full bytes.
  attribution: Legacy associates run/task/attempt/phase/runner; graph associates graph
    stream/node/kind/role/lease/execution and compact bound-record metadata.
  query_surface: Legacy task/attempt prompt and trace surfaces; graph node detail/start-event
    summary.
  freshness: Prompt evidence is fixed at the attempted start boundary; graph summary
    shares start position/timestamp but cannot replay exact prompt bytes.
  consistency: Legacy prompt writes can fail silently; graph summary records assembly
    metadata, not delivery acknowledgement, ingestion, or full truncation accounting.
  missing_behavior: No packet hash, content size, directive binding, complete graph
    prompt, or model receipt exists.
  current_availability: The approved bounded audit reports legacy full prompts as
    partial current evidence and graph compact metadata as implemented with inspected-test
    coverage; the current Phase 1 snapshot hash-guards cited implementation/test sources;
    any later source change invalidates this assessment until the hash snapshot is
    refreshed. Full graph prompt retention/delivery coverage remains unknown.
  epistemic_limits: Stored or summarized content proves an assembly/persistence boundary
    only to its carrier-specific extent.
