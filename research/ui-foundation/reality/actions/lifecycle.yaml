schema_version: "1"
key_namespace: provisional
actions:
  - key: action-run-start
    implementation_status: present
    capability_status: current
    executable: true
    command: "REST POST /api/runs/{id}/start; CLI start has divergent direct application"
    actor_and_permission: "Any caller passing optional global auth; no enforced action authorization; legacy operator policy is absent."
    domain_eligibility: "Legacy source state draft; selectable runner/config must be valid."
    expected_source_version: "None supplied by REST or CLI."
    input: "Run ID; REST body/runner selection where applicable."
    validation: "Route/schema identity and runner validation; lifecycle transition validation."
    durable_effect: "REST appends SignalEnqueued(RUN_START); consumer later appends lifecycle evidence. CLI directly applies start."
    result_state: state-run-active
    transition: transition-legacy-start
    failure_stale_race: "REST acceptance is 202 while state can remain draft; duplicate/redelivered signal relies on idempotent or stale-transition handling. CLI has different timing."
    idempotency_retry: "No idempotency key/source version; repeated requests are state-validated, and stale signal handling avoids repeated application."
    reversibility: "Pause/cancel are separate forward actions; start itself has no undo."
    audit_evidence: "SignalEnqueued plus RunStatusChanged/events_v2 and projected run state."
  - key: action-run-pause
    implementation_status: present
    capability_status: current
    executable: true
    command: "REST POST /api/runs/{id}/pause and CLI wrapper"
    actor_and_permission: "Any caller passing optional global auth; no enforced action authorization."
    domain_eligibility: "Legacy active run; stopping is explicitly rejected."
    expected_source_version: "None."
    input: "Run ID."
    validation: "Lifecycle service validates source state; executor cancellation is attempted before PAUSE signal enqueue."
    durable_effect: "Immediately projects active to stopping and appends/enqueues pause; consumer later projects paused."
    result_state: state-run-stopping
    transition: transition-legacy-pause-request
    failure_stale_race: "Executor may be mid-agent between stopping and applied pause; stale activity after pause is ignored."
    idempotency_retry: "Pause is idempotent once paused in engine semantics; no request key/version."
    reversibility: "Resume is operational compensation, not restoration of cancelled/lost in-flight work."
    audit_evidence: "Run status events, SignalEnqueued/SignalProcessed positions, pause reason, activity."
  - key: action-run-resume
    implementation_status: present
    capability_status: current
    executable: true
    command: "REST POST /api/runs/{id}/resume"
    actor_and_permission: "Any caller passing optional global auth; no enforced action authorization."
    domain_eligibility: "Paused/resumable run; retired runner needs explicit replacement. Legacy failed run is not resumable."
    expected_source_version: "None."
    input: "Run ID; optional runner/config and continue or reset_worktree strategy."
    validation: "Request enum/config validation and lifecycle/runner availability checks."
    durable_effect: "Enqueues RESUME; consumer later applies active state; reset_worktree can discard worktree file state."
    result_state: state-run-active
    transition: transition-legacy-resume
    failure_stale_race: "202/acceptance can precede application; invalid/stopping state returns conflict; redelivery uses stale/idempotent handling."
    idempotency_retry: "No idempotency key/source version; retry after unknown result requires refresh/polling."
    reversibility: "Pause compensates active execution; reset_worktree is not undone by resume."
    audit_evidence: "Signal and status events; agent_changed event when configuration changes; resulting projection."
  - key: action-run-cancel
    implementation_status: present
    capability_status: current
    executable: true
    command: "REST POST /api/runs/{id}/cancel and CLI wrapper"
    actor_and_permission: "Any caller passing optional global auth; no enforced action authorization."
    domain_eligibility: "Active, paused, or stopping legacy source; graph path additionally drives graph cancellation to terminal."
    expected_source_version: "None."
    input: "Run ID."
    validation: "STOPPING rejection and lifecycle/domain transition checks."
    durable_effect: "Cancels executor(s), enqueues CANCEL, and consumer applies cancelled; graph revokes leases/nodes before row cancellation."
    result_state: state-run-cancelled
    transition: transition-legacy-cancel
    failure_stale_race: "Acceptance/application are distinct; graph and legacy ordering differ; stale queued work is state-validated."
    idempotency_retry: "No idempotency key; duplicate requests are safe only through terminal/state validation."
    reversibility: "Irreversible; recovery is a different capability and does not uncancel."
    audit_evidence: "Signal/lifecycle events, graph cancellation events where applicable, projected terminal row."
