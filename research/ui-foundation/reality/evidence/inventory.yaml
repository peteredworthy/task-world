- kind: accepted-graph-record
  identity: record_id, record_type, producer_node_id, producer_port, run_id, graph_position, schema version, and typed payload.
  producer: Graph dispatch callbacks, check execution, and graph command acceptance paths.
  persistence: Accepted-record events are durable; compact node-detail record materializations may omit heavy values and are
    rebuildable.
  attribution: Strong producer node/port and run attribution; selected records add candidate, task-region, attempt, evaluated-record,
    or file-state references.
  query_surface: Graph event and node-detail readbacks expose retained record materialization; no normalized record table
    was found.
  freshness: A record is a boundary snapshot at its graph position and is not automatically current after later graph or repository
    changes.
  consistency: Acceptance and bindings are reduced from events; record IDs in input ports represent binding references, not
    entity equivalence.
  missing_behavior: No universal record store, complete relational joins, or proof that task_region_id identifies a core task/region.
  current_availability: Reported by the approved bounded audit as implemented and covered by inspected tests for typed acceptance,
    provenance fields, bindings, and node-detail replay; implementation/test source freshness is not hash-guarded and no fresh
    test result is asserted. Heavy values and core-entity joins remain partial or unknown.
  epistemic_limits: Record payload meaning is type-specific; summary omission and optional references constrain what can be
    concluded.
