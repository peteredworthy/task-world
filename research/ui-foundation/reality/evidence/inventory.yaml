- kind: decision-evidence
  identity: 'Carrier-specific: graph decision event/record IDs, clarification request/response IDs, approval records, patch
    attempt/event IDs, or workflow event position.'
  producer: Graph record_decision/patch commands, clarification and approval workflows, and transport-specific action handlers.
  persistence: Many decisions append durable events/records; queued lifecycle acceptance and some administrative/file operations
    do not supply one uniform result record.
  attribution: Graph endpoint identities may be caller-supplied or fixed operator; legacy paths use fixed/injected/caller-supplied
    values not bound uniformly to JWT claims.
  query_surface: Graph decision views/events, clarification histories, run activity, and action-specific responses; no universal
    decision ledger.
  freshness: Decision read models are current through their event/projection position; queued acceptance is not proof that
    an eventual result has occurred.
  consistency: 'Transport result contracts diverge: REST/MCP/CLI can differ in acceptance timing, response shape, and signal-queue
    behavior.'
  missing_behavior: No universal durable action-result identity, consistently authenticated actor attribution, or complete
    acceptance/rejection/result/next-activity bundle.
  current_availability: The approved bounded audit reports specific graph and workflow decision carriers as implemented, with
    inspected-test coverage where cited; implementation/test source freshness is not hash-guarded and no fresh test result
    is asserted. Cross-carrier receipts, actor binding, and result-state coverage remain partial/unknown.
  epistemic_limits: Recorded actor text or a successful acceptance response does not prove authorization, resulting state,
    or causal downstream effect.
