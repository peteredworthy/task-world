id: ACT-28
title: Skip manual-gate step and resume legacy run
definition: Skips the current manual-gate step and performs the immediate paused-to-active legacy run transition before later
  progression evaluation.
implementation_status: present
capability_status: current
executable: true
command_id: CMD-33
actor: caller
permission_requirements:
- PER-3
preconditions:
- legacy run is paused with pause reason manual_gate
- target is the current actionable step
expected_source_version: No client step or run version
required_input:
  run_id: required
  step_id: required
validation:
- manual-gate paused-run validation
- current actionable-step validation
durable_effect: Records StepSkipped, completes the skipped step, advances its index, and records the immediate run resume;
  later progression can independently pause at another manual gate.
resulting_state_id: STA-2
failure_modes:
- 404 run or step identity
- 409 run is not manual-gate paused
- 409 target is not the current actionable step
stale_state_behavior: A changed run pause reason or actionable step is rejected.
idempotency: No idempotency key; a completed or non-current step cannot be skipped again.
retry_behavior: Refresh run and current-step state before retrying.
reversibility: No exact undo; transition-back does not restore all file or external effects.
audit_evidence_ids:
- EVD-7
- EVD-12
transition:
  from_state_id: STA-4
  to_state_id: STA-2
enforced_authentication: Optional global valid-bearer gate
enforced_authorization: absent
domain_eligibility: Current legacy step while its run is paused at manual_gate.
proposed_role_policy: null
conflict_ids: []
