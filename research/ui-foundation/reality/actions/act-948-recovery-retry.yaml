id: ACT-948
title: Retry legacy recovering task
definition: Completes recovery with retry, creates the next attempt, and returns the recovering task to building.
implementation_status: present
capability_status: current
executable: true
command_id: CMD-909
actor: caller
permission_requirements: [PER-902]
preconditions: ["legacy task is recovering"]
expected_source_version: "No client task version"
required_input: {run_id: required, task_id: required, notes: optional}
validation: ["complete-recovery outcome retry", "recovering-task state validation"]
durable_effect: "Records recovery notes, creates an attempt, changes the task to building, and may separately resume a paused run."
resulting_state_id: STA-908
failure_modes: ["404 run or task identity", "409 task is not recovering", "400 invalid REST outcome"]
stale_state_behavior: "A task advanced beyond recovering is rejected."
idempotency: "Not idempotent after success because it creates a new attempt."
retry_behavior: "Refresh task state before resending."
reversibility: "No direct reversal of the recovery retry."
audit_evidence_ids: [EVI-907]
transition: {from_state_id: STA-911, to_state_id: STA-908}
enforced_authentication: "Optional global valid-bearer gate"
enforced_authorization: absent
domain_eligibility: "Legacy recovering task only."
proposed_role_policy: null
