id: ACT-32
title: Skip legacy recovering task
definition: Completes recovery with skip and completes the recovering legacy task.
implementation_status: present
capability_status: current
executable: true
command_id: CMD-9
actor: caller
permission_requirements:
- PER-3
preconditions:
- legacy task is recovering
expected_source_version: No client task version
required_input:
  run_id: required
  task_id: required
  notes: optional
validation:
- complete-recovery outcome skip
- recovering-task state validation
durable_effect: Records skipped outcome and notes, completes the task, and may separately resume or progress the run.
resulting_state_id: STA-14
failure_modes:
- 404 run or task identity
- 409 task is not recovering
- 400 invalid REST outcome
stale_state_behavior: A task advanced beyond recovering is rejected.
idempotency: No idempotency key; a completed task is no longer a legal recovery source.
retry_behavior: Refresh task state before resending.
reversibility: No direct inverse for a skipped recovery outcome.
audit_evidence_ids:
- EVD-14
transition:
  from_state_id: STA-12
  to_state_id: STA-14
enforced_authentication: Optional global valid-bearer gate
enforced_authorization: absent
domain_eligibility: Legacy recovering task only.
proposed_role_policy: null
