schema_version: "1"
key_namespace: provisional
actions:
  - key: action-clarification-respond
    implementation_status: present
    capability_status: current
    executable: true
    command: "REST POST /api/clarifications/{request_id}/respond"
    actor_and_permission: "Recorded responder is fixed/caller-supplied by legacy path; optional global authentication is not bound to it; no action authorization."
    domain_eligibility: "Existing pending clarification on a clarification-paused legacy task/run."
    expected_source_version: "No request version."
    input: "Request ID, typed answer variants, optional skip fields."
    validation: "Schema variants exist, but required-answer, option-membership, and numeric-bound checks are incomplete."
    durable_effect: "Persists response event/config updates, clears pending state, resumes eligible clarification-paused run, and appends Q&A artifact."
    result_state: state-task-building
    transition: transition-legacy-clarification-answer
    failure_stale_race: "StaleDataError maps to 409 and must not reopen a completed task; artifact append occurs before DB conflict resolution and can duplicate."
    idempotency_retry: "No idempotency key; retry after uncertain response can duplicate artifact content before stale conflict."
    reversibility: "No answer revision or undo command."
    audit_evidence: "Clarification request/response IDs, response event, run config, pending-action change, Q&A artifact."
  - key: action-task-approve
    implementation_status: present
    capability_status: current
    executable: true
    command: "REST task approve endpoint"
    actor_and_permission: "Injected/fixed user identity is recorded; optional global auth is not action authorization."
    domain_eligibility: "Legacy task pending approval/user action."
    expected_source_version: "None."
    input: "Task ID and optional comment."
    validation: "Route identity and task transition checks."
    durable_effect: "Records ApprovalDecision and completes the task; workflow may progress."
    result_state: state-task-completed
    transition: transition-legacy-approve-task
    failure_stale_race: "Wrong/advanced source state rejects; no client refresh receipt is standardized."
    idempotency_retry: "No decision ID or expected version; repeated request is constrained by resulting state."
    reversibility: "No direct approval reversal."
    audit_evidence: "ApprovalDecision event, task/run projection, attempt/workflow events."
  - key: action-task-reject
    implementation_status: present
    capability_status: current
    executable: true
    command: "REST task reject endpoint"
    actor_and_permission: "Injected/fixed user identity is recorded; optional global auth is not action authorization."
    domain_eligibility: "Legacy task pending approval/user action and retry budget outcome applies."
    expected_source_version: "None."
    input: "Task ID and optional reason."
    validation: "Route identity and task transition/attempt-limit checks."
    durable_effect: "Records rejection and returns task to building when attempts remain; otherwise task fails."
    result_state: state-task-building
    transition: transition-legacy-reject-task
    failure_stale_race: "Wrong/advanced source state rejects; attempt-limit branch has a different resulting state."
    idempotency_retry: "No decision ID/version; retry is state-validated and is not a replacement for revision semantics."
    reversibility: "No direct rejection undo; later approval/revision is a distinct forward action."
    audit_evidence: "ApprovalDecision, task/attempt snapshot, task/run status events."
  - key: action-step-approve
    implementation_status: present
    capability_status: current
    executable: true
    command: "REST step approve endpoint; CLI approve wrapper"
    actor_and_permission: "Caller-supplied approved_by/fixed UI user is attribution only; no enforced product-role authorization."
    domain_eligibility: "Current actionable legacy step with a human approval gate."
    expected_source_version: "None."
    input: "Run/step identity, approver identity, optional comment."
    validation: "Current/gated step validation; absent/future/non-gated step rejects."
    durable_effect: "Persists StepHumanApprovalRecorded and may enqueue resume/spawn execution."
    result_state: state-step-approved
    transition: transition-legacy-step-approve
    failure_stale_race: "Repeated approvals are last-write-wins, not decision-idempotent; CLI 'no' still posts approval in legacy mode."
    idempotency_retry: "No expected version/idempotency key; refreshing gate state is required before retry."
    reversibility: "No legacy step deny/defer or exact undo endpoint."
    audit_evidence: "StepHumanApprovalRecorded plus approval fields/time and downstream lifecycle events."
