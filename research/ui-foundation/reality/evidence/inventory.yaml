    and legacy cost report, each with different coverage.
  freshness: Graph UTC day derives from event time; facts are immutable per execution
    key. Pricing resolution details are not persisted, and cost-row writes can fail.
  consistency: Rollup counts latency/actions once per run/execution and exposes rate_missing,
    but excludes legacy records and unreported/exception-terminated executions.
  missing_behavior: No fact for exact-zero versus absent usage, runner exceptions
    after provider use, complete rate cards, fleet-wide denominator, budget pace,
    price-coverage field, or cost-of-next-attempt algorithm.
  current_availability: The approved bounded audit reports graph returned-execution
    usage and the graph-only rollup as implemented with inspected-test coverage; the
    current Phase 1 snapshot hash-guards cited implementation/test sources; any later
    source change invalidates this assessment until the hash snapshot is refreshed.
    Legacy, exact-zero/absent, and exception-terminated coverage remain partial/unknown.
  epistemic_limits: Numeric zero may mean legitimate explicit-zero pricing or unavailable
    numeric cost; absent usage is not evidence of zero consumption.
