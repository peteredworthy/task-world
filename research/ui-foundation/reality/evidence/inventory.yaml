- kind: graph-event
  identity: Graph EventEnvelope event_id plus graph-local position; durable SQL aggregate
    identity is (graph:<run_id>, version).
  producer: GraphController command handling and GraphEventStore.append_events.
  persistence: Graph events, compact summaries, node details, checkpoints, usage read
    model, outbox rows, and JSONL queue update transactionally; projections are disposable.
  attribution: Run, actor, and applicable node, lease, execution, and record IDs are
    carried in typed payloads.
  query_surface: GET /api/runs/{run_id}/graph/events provides the graph ledger in
    summary/full modes; selected events also appear in activity.
  freshness: Graph position and event timestamp describe append order/time; rebuilt
    projections are current only through their applied position.
  consistency: Event append and graph read models roll back together; activity is
    an intentionally incomplete cross-stream projection.
  missing_behavior: No endpoint returns the complete joined workflow-plus-graph chronology;
    callback observed_graph_position is not outcome validation evidence.
  current_availability: Reported by the approved bounded audit as implemented and
    covered by inspected tests for append, typed payloads, replay, compact/full readback,
    and transaction rollback; the current Phase 1 snapshot hash-guards cited implementation/test
    sources; any later source change invalidates this assessment until the hash snapshot
    is refreshed. Projection detail and combined-stream availability remain partial.
  epistemic_limits: Actor/correlation fields aid tracing but do not prove a business-causal
    relation; a projection can omit heavy payload detail.
