preconditions:
- A graph exists and its run is not cancelled or failed.
- The target is an eligible nonterminal oversight decision target.
expected_source_version: The REST request has no client graph position; the controller
  supplies the current position and rejects a concurrent append conflict.
required_input:
  decision_type: oversight
  value: required
  target_node_id: required
