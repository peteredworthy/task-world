  reason: optional
  record_id: optional
command_variant:
  discriminator: decision_type
  decision_type: oversight
  value: required
validation:
- RecordDecisionCommand strictly validates the oversight decision payload and target
  eligibility.
- PER-4 validates graph state, target terminality, and actor/context shape.
durable_effect: Appends oversight_decision_recorded and updates the oversight decision
  projection. Oversight creates no DecisionRecord or AuthorityDecisionRecord output
  record.
resulting_state_id: STA-37
failure_modes:
- 404 when no graph exists
- 409 for stale append or command rejection
- 422 for malformed or ineligible oversight input
stale_state_behavior: A controller/append race returns 409. No source-version field
  exists on the request and no generic rejected state is projected.
idempotency: No REST idempotency key is established; callers must use the returned
  decision projection rather than infer exactly-once behavior.
retry_behavior: Refresh the oversight decision projection and retry only while the
  target remains eligible.
reversibility: No oversight-decision reversal command exists.
