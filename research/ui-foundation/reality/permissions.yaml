  implementation_status: present
  test_status: unexercised
  documentation_status: documented
  capability_status: unknown
  epistemic_status: observed
  confidence: medium
  confidence_basis: routines.py::validate_routine route inspection
  evidence_ids:
  - EVD-46
  conflict_ids:
  - CON-4
  question_ids:
  - Q-5
  limitations:
  - Validation response is not a saved routine or metadata effect
  prohibited_interpretations:
  - YAML validation authorizes routine publication
  enforced_authentication: Optional global valid-bearer gate
  enforced_authorization: absent
  domain_eligibility: YAML parseability and RoutineConfig schema validation only.
  proposed_product_role_policy: null
- id: PER-7
  title: Review and administration domain eligibility
  definition: Review, git, environment, routine metadata, agent, runner-default, and repository routes
    apply their route-specific worktree, readiness, schema, identity, or filesystem prerequisites outside
    the legacy workflow transition model.
  implementation_status: present
  test_status: unexercised
  documentation_status: documented
  capability_status: unknown
  epistemic_status: observed
  confidence: medium
  confidence_basis: review/admin action-route inspection
  evidence_ids:
  - EVD-29
  - EVD-31
  - EVD-33
  - EVD-34
  - EVD-35
  - EVD-47
  - EVD-48
  conflict_ids:
  - CON-4
  question_ids:
  - Q-5
  limitations:
  - Route eligibility does not establish ownership, containment, or role authorization beyond what the
    specific route checks
  prohibited_interpretations:
  - Git, filesystem, or configuration eligibility is product-role authorization
  - Legacy workflow transition eligibility
  enforced_authentication: Optional global valid-bearer gate
  enforced_authorization: absent
  domain_eligibility: Concrete review/admin endpoint prerequisites; no shared administrative permission
    or legacy workflow transition rule is inferred.
  proposed_product_role_policy: null
