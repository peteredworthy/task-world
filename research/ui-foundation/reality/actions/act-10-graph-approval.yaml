    - STA-32
    to_state_id: STA-33
  ordering: One CMD-11 command records the decision and separately projects the node
    outcome; this is not a STA-37-to-node edge.
enforced_authentication: PER-1 optional global valid-bearer gate.
enforced_authorization: absent
domain_eligibility: PER-4 graph decision target, state, actor/context, and value validation.
