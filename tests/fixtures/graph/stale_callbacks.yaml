- name: stale_approval_after_cancellation
  given_events:
    - run_lifecycle_changed: {command_type: cancel, from_state: cancelling, to_state: cancelled, trigger: cancel_command_accepted}
    - node_created: {node_id: gate-stale-7, kind: gate, state: completed}
    - lease_granted: {node_id: gate-stale-7, lease_id: lease-7, generation: 1}
  when_command:
    submit_callback: {node_id: gate-stale-7, execution_id: exec-7, lease_id: lease-7, lease_generation: 1, base_snapshot_id: S0, observed_graph_position: 3, idempotency_key: key-7, payload_hash: hash-7}
  then_events:
    - callback_rejected_stale: {node_id: gate-stale-7}
  then_projection: {run_state: cancelled}

- name: stale_resume_after_cancel
  given_events:
    - run_lifecycle_changed: {command_type: cancel, from_state: cancelling, to_state: cancelled, trigger: cancel_command_accepted}
  when_command: {resume: {}}
  then_events:
    - command_rejected: {command_type: resume}
  then_projection: {run_state: cancelled}

- name: stale_pause_callback_race_callback_first
  given_events:
    - run_lifecycle_changed: {command_type: start, from_state: queued, to_state: active, trigger: start_command_accepted}
    - node_created: {node_id: worker-stale-9a, kind: worker, state: running, task_region_id: task-stale-9a}
    - lease_granted: {node_id: worker-stale-9a, lease_id: lease-9a, generation: 1}
  when_command:
    submit_callback:
      node_id: worker-stale-9a
      execution_id: exec-9a
      lease_id: lease-9a
      lease_generation: 1
      base_snapshot_id: S0
      observed_graph_position: 3
      idempotency_key: key-9a
      payload:
        output_records:
          - record_id: file-state-stale-9a
            record_kind: file_state
            record_type: file_state
            producer_node_id: worker-stale-9a
            port: file_state
            schema: FileStateRecord
            snapshot_id: snapshot-stale-9a
            base_snapshot_id: S0
            task_region_id: task-stale-9a
            verdict: captured
          - record_id: candidate-stale-9a
            record_kind: output
            record_type: candidate
            producer_node_id: worker-stale-9a
            port: candidate
            schema: ImplementationCandidate
            task_region_id: task-stale-9a
            candidate_id: candidate-stale-9a
            attempt_number: 1
            value: {summary: stale race callback completed}
  then_events:
    - callback_accepted: {node_id: worker-stale-9a}
    - node_state_changed: {node_id: worker-stale-9a, new_state: completed}
  then_projection: {worker-stale-9a: completed, lease-9a: released}

- name: stale_pause_callback_race_pause_first
  given_events:
    - node_created: {node_id: worker-stale-9b, kind: worker, state: running}
    - lease_granted: {node_id: worker-stale-9b, lease_id: lease-9b, generation: 1}
    - lease_suspended: {node_id: worker-stale-9b, lease_id: lease-9b, reason: pause}
  when_command:
    submit_callback: {node_id: worker-stale-9b, execution_id: exec-9b, lease_id: lease-9b, lease_generation: 1, base_snapshot_id: S0, observed_graph_position: 3, idempotency_key: key-9b, payload_hash: hash-9b}
  then_events:
    - callback_rejected_stale: {node_id: worker-stale-9b, lease_id: lease-9b}
  then_projection: {lease-9b: suspended}
