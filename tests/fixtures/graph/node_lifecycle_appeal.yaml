- name: appeal_planned_to_ready
  given_events:
    - node_created: {node_id: verify-1, kind: verifier, state: completed, task_region_id: task-appeal-1}
    - output_record_accepted: {record_id: candidate-record-appeal-1, record_kind: output, record_type: candidate, producer_node_id: verify-1, port: candidate, schema: ImplementationCandidate, task_region_id: task-appeal-1, candidate_id: cand-appeal-1, attempt_number: 1, value: {summary: appeal candidate}}
    - output_record_accepted: {record_id: verification-appeal-1, record_kind: verification, record_type: verification_report, producer_node_id: verify-1, port: verification_report, schema: VerificationReport, task_region_id: task-appeal-1, candidate_id: cand-appeal-1, outcome: failed, value: {outcome: failed, grades: []}}
    - verification_failed: {node_id: verify-1, verifier_node_id: verify-1, candidate_id: cand-appeal-1, task_region_id: task-appeal-1, record_id: verification-appeal-1, outcome: failed, value: {outcome: failed, grades: []}}
  when_command:
    raise_appeal: {node_id: verify-1, candidate_id: cand-appeal-1, task_region_id: task-appeal-1, appeal_type: invalid_test, appeal_node_id: appeal-1, oversight_node_id: oversight-1}
  then_events:
    - appeal_opened: {node_id: appeal-1, appealed_node_id: verify-1}
    - node_created: {node_id: oversight-1, kind: oversight}
  then_projection: {verify-1: completed, task-appeal-1: pending}

- name: appeal_ready_to_completed
  given_events:
    - node_created: {node_id: appeal-2, kind: appeal, state: ready}
    - oversight_decision_recorded: {decision_type: oversight, node_id: appeal-2, decision: accepted, decider: fixture-controller}
    - node_state_changed: {node_id: appeal-2, new_state: completed, trigger: oversight_decision_accepted}
  when_command: null
  then_events: []
  then_projection: {appeal-2: completed}

- name: appeal_ready_to_failed
  given_events:
    - node_created: {node_id: appeal-3, kind: appeal, state: ready}
    - oversight_decision_recorded: {decision_type: oversight, node_id: appeal-3, decision: rejected, decider: fixture-controller}
    - node_state_changed: {node_id: appeal-3, new_state: failed, trigger: appeal_rejected}
  when_command: null
  then_events: []
  then_projection: {appeal-3: failed}
