expected_source_version: No client run version.
required_input:
  run_id: required
validation:
- legacy lifecycle state validation
- executor cancellation and signal enqueue
durable_effect: Cancels registered execution and appends cancellation signal acceptance
  evidence while the row remains active; the consumer later applies active to cancelled.
  Graph mode separately performs graph-local cancellation before row cancellation.
resulting_state_id: STA-2
failure_modes:
- 404 missing run
- 409 stopping or illegal transition
- executor cancellation failure
stale_state_behavior: Accepted CANCEL preserves active until consumer application;
  redelivery can encounter an already-applied or stale transition and is acknowledged
  or discarded without a typed result receipt.
idempotency: State-validated; no idempotency key. A repeat after row cancellation
  is ineligible.
retry_behavior: Refresh row status and activity before retrying; do not treat 202
  acceptance as cancellation completion.
reversibility: Cancellation has no direct uncancel; recovery is a separate compensating
  capability and does not reverse cancellation.
