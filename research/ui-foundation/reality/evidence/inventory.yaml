- kind: cost-and-usage-fact
  identity: 'Graph usage: execution_id:usage_index; legacy: run/task/attempt/runner/phase cost-row tuple plus per-model attempt/run
    usage.'
  producer: Post-return ExecutionResult extraction in graph dispatch and legacy PhaseHandler; GraphController.record_node_usage;
    AttemptStore cost upsert.
  persistence: Graph facts are append-oriented events/read models; legacy usage is event-projected while CostRecordModel is
    mutable best-effort direct upsert.
  attribution: Graph carries run/node/kind/role/profile/execution/model; legacy carries run/task/attempt/phase/runner/model.
    Sub-agent identity/type is not retained in graph usage.
  query_surface: Graph-only GET /api/runs/cost-rollup; run/API per-model projections and legacy cost report, each with different
    coverage.
  freshness: Graph UTC day derives from event time; facts are immutable per execution key. Pricing resolution details are
    not persisted, and cost-row writes can fail.
  consistency: Rollup counts latency/actions once per run/execution and exposes rate_missing, but excludes legacy records
    and unreported/exception-terminated executions.
  missing_behavior: No fact for exact-zero versus absent usage, runner exceptions after provider use, complete rate cards,
    fleet-wide denominator, budget pace, price-coverage field, or cost-of-next-attempt algorithm.
  current_availability: The approved bounded audit reports graph returned-execution usage and the graph-only rollup as implemented
    with inspected-test coverage; implementation/test source freshness is not hash-guarded and no fresh test result is asserted.
    Legacy, exact-zero/absent, and exception-terminated coverage remain partial/unknown.
  epistemic_limits: Numeric zero may mean legitimate explicit-zero pricing or unavailable numeric cost; absent usage is not
    evidence of zero consumption.
