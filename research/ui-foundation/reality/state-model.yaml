carrier_synchronization:
  - "REST lifecycle acceptance is command evidence and commonly source-preserving; the signal consumer later applies the row transition."
  - "Graph cancellation transitions graph-run cancelling to graph-run cancelled; affected graph nodes separately transition from their own pending carrier to cancelled before the consumer separately applies legacy row cancellation. No cross-carrier transition is declared."
  - "Graph completion and failure, legacy row completion and failure, graph node outcomes, and decision records are separately observed carriers, not aliases."
  - "Carrier-local result states document the durable or projected result of the routed family; they do not form a universal applied/rejected receipt."
  - "Fan-out retry changes the failed child to legacy task pending and separately preserves the parent fan-out-running carrier; no one resulting state represents both rows."
  - "Transition-back preserves its eligible legacy run row while separately resetting affected non-completed tasks to pending. Run recovery separately moves failed or paused rows to paused, targets a task for building, and resets downstream tasks to pending."
  - "The REST lifecycle routes inspected reject STOPPING for pause, resume, cancel, and recover. No stopping-to-stopping acceptance transition is declared."
  - "Graph decision pending-to-recorded, graph node pending-to-outcome, and graph run cancellation are separate carrier-local transitions. Decision recording does not transition a graph node."
  - "Graph patch submission preserves graph active on the separate graph-run carrier. Submitted patches transition to accepted or rejected patch-attempt carriers; budget rejection can separately create a ready gate."
  - "Graph node readiness, leasing, running, suspension, and cancellation are node-local NodeState transitions. Graph-run active or paused may independently enter cancelling; cancellation does not use pending as a substitute for an already leased, running, or suspended node."
  - "The qualified run-recovery command can reset completed downstream legacy tasks to pending; this does not make ordinary completed-task transitions nonterminal."
