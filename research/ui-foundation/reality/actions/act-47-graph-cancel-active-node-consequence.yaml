stale_state_behavior: A later or duplicate cancellation observes the current graph
  node/lease state; it does not invent a cross-carrier recovery transition.
idempotency: No key; node and lease state make repeated cancellation application domain-dependent.
retry_behavior: Refresh graph node, lease, and graph-run projections; do not replay
  this consequence independently of cancellation.
reversibility: No direct node uncancel exists; any recovery path is separate graph
  work.
