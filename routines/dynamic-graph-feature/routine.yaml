routine:
  id: "dynamic-graph-feature"
  name: "Dynamic Feature Graph Routine"
  description: "Graph-mode starter for feature work driven by a dynamic planner and graph patches only."
  execution_mode: "graph"
  planner_generation_budget: 10
  file_state_policy:
    scan_budget:
      max_entries: 50000
      max_bytes: 1073741824
  semantic_artifact_schemas:
    - schema_id: "reliable-plan-implementation-plan"
      version: 1
      semantic_role: "implementation_plan"
      json_schema:
        type: object
        required:
          - batches
        properties:
          summary:
            type: string
          batches:
            type: array
            minItems: 1
            items:
              type: object
              required:
                - batch_id
                - objective
                - acceptance
              properties:
                batch_id:
                  type: string
                  minLength: 1
                objective:
                  type: string
                  minLength: 1
                scope:
                  type: array
                  items:
                    type: string
                requirement_ids:
                  type: array
                  items:
                    type: string
                acceptance:
                  type: array
                  minItems: 1
                  items:
                    type: string
                checks:
                  type: array
                  items:
                    type: string
              additionalProperties: true
        additionalProperties: true
  inputs:
    - name: feature_spec_path
      required: true
      description: "Repo-relative path to the feature specification document"
    - name: feature_spec_content
      required: false
      default: ""
      description: "Optional embedded feature specification text for worktrees that cannot read the spec path"
    - name: acceptance_command
      required: true
      description: "Verification command that determines final acceptance"
    - name: acceptance_command_timeout_seconds
      required: false
      default: 180.0
      description: "Bounded timeout for the dynamic acceptance command (0 < seconds <= 3600)"
    - name: hidden_oracle_command
      required: false
      default: ""
      description: "Optional hidden-oracle validation command to run during planning"
    - name: patch_budget
      required: false
      default: 8
      description: "Patch budget for dynamic planner horizons"
    - name: gap_policy_profile
      required: false
      default: "standard"
      description: "Gap policy profile identifier for generated gap-planner nodes"

  steps:
    - id: "S-01"
      kind: "planner"
      title: "Plan dynamic feature execution graph"
      available_tools:
        - submit_graph_patch
        - construct_reliable_plan_region
      step_context: |
        Supply one bounded semantic work decision per horizon with
        `construct_reliable_plan_region`; controller code owns graph construction,
        evidence wiring, model assignments, checks, and continuations.
